<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banvy</title>
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --ink:#eaf3ec; --dim:#9db3a5; --faint:#6d8579;
  --glass:rgba(9,18,14,.72); --edge:rgba(150,220,175,.16);
  --turf:#5fd07a; --amber:#f0a23a; --sand:#e2cf9a; --water:#4bb4d8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#070d10;color:var(--ink);
  font-family:Outfit,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
canvas{display:block;position:fixed;inset:0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

/* ---- boot ---- */
#boot{position:fixed;inset:0;z-index:90;display:grid;place-items:center;
  background:radial-gradient(120% 90% at 50% 20%,#12242c 0%,#070d10 70%);transition:opacity .7s .2s}
#boot.done{opacity:0;pointer-events:none}
#boot .inner{width:min(420px,80vw);text-align:center}
#boot h1{font-size:19px;font-weight:700;letter-spacing:.01em}
#boot .sub{font-size:11.5px;color:var(--faint);margin-top:5px;letter-spacing:.14em;text-transform:uppercase}
#bar{height:2px;background:rgba(255,255,255,.09);border-radius:2px;margin-top:22px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2f9f63,var(--turf));transition:width .35s}
#bmsg{font-size:11px;color:var(--dim);margin-top:9px;min-height:14px}

/* ---- panels ---- */
.panel{position:fixed;z-index:20;background:var(--glass);backdrop-filter:blur(22px) saturate(1.25);
  -webkit-backdrop-filter:blur(22px) saturate(1.25);border:1px solid var(--edge);border-radius:15px;
  box-shadow:0 18px 46px rgba(0,0,0,.45)}
.hd{position:fixed;top:14px;left:14px;padding:11px 15px}
.hd h1{font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.hd p{font-size:10px;color:var(--faint);letter-spacing:.13em;text-transform:uppercase;margin-top:2px}

/* card */
#card{top:14px;left:50%;transform:translateX(-50%);padding:9px 12px;display:flex;gap:13px;align-items:center}
#card .no{font-size:26px;font-weight:800;line-height:1;min-width:34px;text-align:center}
#card .mid{display:flex;flex-direction:column;gap:2px}
#card .nm{font-size:12.5px;font-weight:600;white-space:nowrap;max-width:min(38vw,340px);overflow:hidden;text-overflow:ellipsis}
#card .pi{font-size:10px;color:var(--dim);letter-spacing:.05em}
#tees{display:flex;gap:5px}
.tee{padding:4px 7px;border-radius:8px;text-align:center;min-width:44px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);cursor:pointer}
.tee b{display:block;font-size:12.5px;font-weight:700;font-family:'JetBrains Mono',monospace}
.tee i{display:block;font-size:8px;font-style:normal;letter-spacing:.06em;opacity:.62;margin-top:1px}
.tee.on{background:rgba(95,208,122,.16);border-color:rgba(95,208,122,.45)}

/* right rail. The light row is TWO rows in the markup: five Swedish labels can
   never share 168px, and "Höst" spent weeks clipped off the panel's edge. */
#rail{top:14px;right:14px;padding:9px;display:flex;flex-direction:column;gap:7px;width:200px}
.grp{display:flex;gap:5px}
.btn{flex:1;min-width:0;padding:6px 4px;border-radius:9px;border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.04);color:var(--dim);font:600 10px/1.2 Outfit,sans-serif;
  cursor:pointer;text-align:center;letter-spacing:.04em;transition:.15s}
.btn:hover{background:rgba(255,255,255,.09);color:var(--ink)}
.btn.on{background:rgba(95,208,122,.17);border-color:rgba(95,208,122,.42);color:var(--turf)}
.lbl{font-size:8.5px;color:var(--faint);letter-spacing:.15em;text-transform:uppercase;margin:2px 0 -1px}
#facts{font-size:10px;color:var(--dim);line-height:1.55;padding-top:4px;border-top:1px solid rgba(255,255,255,.06)}
#facts b{color:var(--ink);font-family:'JetBrains Mono',monospace;font-weight:600}

/* note */
#note{bottom:76px;left:14px;max-width:330px;padding:10px 13px;font-size:11px;line-height:1.55;color:var(--dim)}
#note b{color:var(--ink);display:block;font-size:11.5px;margin-bottom:3px;letter-spacing:.02em}

/* holes */
#holes{bottom:14px;left:50%;transform:translateX(-50%);padding:6px;display:flex;gap:3px}
.hb{width:29px;height:29px;border-radius:8px;border:1px solid transparent;background:transparent;
  color:var(--faint);font:600 11px/1 Outfit,sans-serif;cursor:pointer;transition:.13s}
.hb:hover{background:rgba(255,255,255,.07);color:var(--ink)}
.hb.on{background:var(--turf);color:#04140a;font-weight:800}

/* minimap */
#mini{bottom:14px;right:14px;width:186px;height:186px;padding:7px}
@media(min-width:1200px){#mini{width:232px;height:232px}}
#mini canvas{position:static;width:100%;height:100%;border-radius:9px}

#hint{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);z-index:19;font-size:10px;
  color:var(--faint);letter-spacing:.08em;pointer-events:none;transition:opacity .6s}

/* ren vy: everything fades, the landscape stays. The ghost button brings it back. */
.panel,#hint,#uiToggle{transition:opacity .35s}
body.clean .panel,body.clean #hint,body.clean #uiToggle{opacity:0;pointer-events:none}
#cleanExit{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top));
  right:calc(10px + env(safe-area-inset-right));z-index:41;width:34px;height:34px;
  border-radius:17px;background:rgba(9,18,14,.5);border:1px solid var(--edge);
  color:var(--dim);font:600 15px/1 Outfit,sans-serif;cursor:pointer;opacity:.55}
body.clean #cleanExit{display:block}

/* the bansafari's letterbox and title card */
body.tour::before,body.tour::after{content:"";position:fixed;left:0;right:0;height:7vh;
  background:#000;z-index:15;pointer-events:none}
body.tour::before{top:0}body.tour::after{bottom:0}
#tourCard{position:fixed;left:50%;bottom:12vh;transform:translateX(-50%);z-index:16;
  text-align:center;opacity:0;transition:opacity .9s;pointer-events:none;max-width:82vw;
  text-shadow:0 2px 18px rgba(0,0,0,.85)}
#tourCard.show{opacity:1}
#tourCard .tno{font-size:14px;color:var(--turf);font-weight:800;letter-spacing:.22em}
#tourCard .tnm{font-size:25px;font-weight:800;margin-top:2px}
#tourCard .ttx{font-size:12.5px;color:var(--dim);margin-top:5px;line-height:1.5}

/* kikaren's readout */
#kikOut{display:none;bottom:180px;left:14px;max-width:300px;padding:9px 12px;
  font-size:11px;line-height:1.6;color:var(--dim)}
#kikOut.show{display:block}
#kikOut b{color:var(--ink);font-family:'JetBrains Mono',monospace;font-weight:600}
@media(max-width:980px){#kikOut{bottom:auto;top:calc(64px + env(safe-area-inset-top));left:8px}}

#toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:40;padding:9px 14px;border-radius:11px;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.25);
  -webkit-backdrop-filter:blur(22px) saturate(1.25);border:1px solid var(--edge);
  font-size:11.5px;color:var(--ink);opacity:0;pointer-events:none;transition:opacity .4s;
  max-width:86vw;text-align:center}
#toast.show{opacity:1;pointer-events:auto}
#toast a{color:var(--turf)}

/* the mobile Vy/Ljus toggle: the rail is a sheet a thumb opens, not a permanent
   quarter of a phone screen */
#uiToggle{display:none;position:fixed;z-index:21;right:calc(8px + env(safe-area-inset-right));
  bottom:calc(104px + env(safe-area-inset-bottom));padding:10px 14px;border-radius:21px;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.25);
  -webkit-backdrop-filter:blur(22px) saturate(1.25);border:1px solid var(--edge);
  color:var(--dim);font:600 11px/1 Outfit,sans-serif;letter-spacing:.05em;
  align-items:center;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.4)}
#uiToggle.on{color:var(--turf);border-color:rgba(95,208,122,.42)}

/* Panels never overlap; each breakpoint takes something away rather than letting the
   glass stack. Measured, not eyeballed: the LJUS row overflowed its rail by 22px at
   EVERY width until it became two rows; the header's right edge (296px) crosses the
   card's left below ~1080; and on a 412px phone the old rail put "Höst" at x=458 --
   forty-six pixels past the screen. */
@media(max-width:1080px){.hd{display:none}}
@media(max-width:980px){#mini,#note{display:none}}
@media(max-width:700px){
  #card{top:calc(8px + env(safe-area-inset-top));left:calc(8px + env(safe-area-inset-left));
    right:calc(8px + env(safe-area-inset-right));transform:none;gap:9px;padding:7px 10px}
  #card .no{font-size:20px;min-width:24px}
  #card .mid{min-width:0;flex:0 1 auto}
  #card .nm{max-width:none;overflow:hidden;text-overflow:ellipsis}
  #tees{overflow-x:auto;flex:1;margin-left:auto;scrollbar-width:none}
  #tees::-webkit-scrollbar{display:none}
  #tees .tee{flex:0 0 auto}
  #rail{display:none}
  #rail.open{display:flex;top:auto;left:auto;right:calc(8px + env(safe-area-inset-right));
    bottom:calc(152px + env(safe-area-inset-bottom));width:206px;padding:8px}
  #facts{display:none}
  #hint{display:none}
  #uiToggle{display:flex}
  #holes{bottom:calc(8px + env(safe-area-inset-bottom))}
}
@media(max-width:640px){#holes{flex-wrap:wrap;width:300px;justify-content:center}.hb{width:27px;height:27px}}
</style>
</head>
<body>

<div id="boot"><div class="inner">
  <h1>Banvy</h1>
  <p class="sub">laddar banan</p>
  <div id="bar"><i></i></div>
  <div id="bmsg">startar</div>
</div></div>

<script>
/* If three.js never arrives from the CDN the module below simply never runs, and the
   splash sat on "startar" forever with nothing to say. This is deliberately not a
   module so it runs regardless -- and on a browser too old for import maps it is the
   ONLY script that runs, so it is also where the honest version message lives:
   before this check, an iPhone on iOS < 16.4 was told to check its network. */
(function () {
  var booting = function () {
    var b = document.getElementById('boot');
    return b && !b.classList.contains('done');
  };
  var say = function (msg, onlyIdle) {
    var m = document.getElementById('bmsg');
    if (!m || !booting()) return;
    if (onlyIdle && m.textContent !== 'startar') return;
    m.textContent = msg;
  };
  if (!(window.HTMLScriptElement && HTMLScriptElement.supports &&
        HTMLScriptElement.supports('importmap')) ||
      typeof DecompressionStream === 'undefined') {
    say('webbläsaren är för gammal för den här sidan — uppdatera till iOS 16.4 / en nyare webbläsare');
    return;
  }
  var t = setTimeout(function () {
    say('tar ovanligt länge — sidan hämtar ~1,5 MB grafik första gången; kontrollera anslutningen', true);
  }, 12000);
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target.tagName === 'SCRIPT') {
      clearTimeout(t);
      say('kunde inte hämta three.js — kontrollera anslutningen och ladda om');
    } else if (e && e.message) {
      clearTimeout(t);
      say('fel vid start: ' + e.message);
    }
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    clearTimeout(t);
    var r = e && e.reason;
    say('fel vid start: ' + (r && r.message ? r.message : r));
  });
}());
</script>

<div class="panel hd">
  <h1>Banvy</h1>
  <p id="hdsub">18 hål</p>
</div>

<div class="panel" id="card">
  <div class="no" id="cno">1</div>
  <div class="mid">
    <div class="nm" id="cnm">—</div>
    <div class="pi" id="cpi">—</div>
  </div>
  <div id="tees"></div>
</div>

<div class="panel" id="rail">
  <div class="lbl">Vy</div>
  <div class="grp">
    <button class="btn" data-cam="tee">Tee</button>
    <button class="btn" data-cam="green">Green</button>
    <button class="btn on" data-cam="orbit">Fritt</button>
    <button class="btn" data-cam="top">Ovan</button>
  </div>
  <div class="lbl">Ljus</div>
  <div class="grp">
    <button class="btn on" data-preset="golden">Kväll</button>
    <button class="btn" data-preset="noon">Dag</button>
    <button class="btn" data-preset="mist">Dis</button>
  </div>
  <div class="grp">
    <button class="btn" data-preset="dawn">Gryning</button>
    <button class="btn" data-preset="host">Höst</button>
  </div>
  <div class="grp"><button class="btn" id="flyBtn">Flygtur</button><button class="btn" id="tourBtn">Bansafari</button></div>
  <div class="grp"><button class="btn" id="rangeBtn">Kikaren</button><button class="btn" id="gridBtn">Greengrid</button></div>
  <div class="grp"><button class="btn on" id="skyltBtn">Skyltar</button></div>
  <div class="grp"><button class="btn" id="shareBtn">Dela vyn</button><button class="btn" id="fotoBtn">Foto</button></div>
  <div id="facts"></div>
</div>

<div class="panel" id="note"><b id="nnm">—</b><span id="ntx"></span></div>

<div class="panel" id="holes"></div>
<div class="panel" id="mini"><canvas id="minic" width="360" height="360"></canvas></div>
<div id="hint">dra för att se dig omkring · rulla för att zooma</div>
<button id="uiToggle">Vy · Ljus</button>
<button id="cleanExit" title="visa panelerna">×</button>
<div id="tourCard"><div class="tno">HÅL 1</div><div class="tnm">—</div><div class="ttx"></div></div>
<div class="panel" id="kikOut"></div>
<div id="toast"></div>



<script type="module" src="/src/main.js"></script>
</body>
</html>
