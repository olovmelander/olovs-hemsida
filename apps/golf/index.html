<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banvy 3D — Svenska golfbanor i realtid</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#0b1a13">
<meta name="description" content="Sex svenska golfbanor i 3D, mätta mot klubbarnas egna kort och byggda ur verklig terräng.">
<link href="/fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --ink:#eaf3ec; --dim:#9db3a5; --faint:#6d8579;
  --glass:rgba(9,18,14,.78); --edge:rgba(150,220,175,.18);
  --turf:#5fd07a; --amber:#f0a23a; --sand:#e2cf9a; --water:#4bb4d8;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#070d10;color:var(--ink);
  font-family:Outfit,ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
canvas{display:block;position:fixed;inset:0}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

/* ---- boot screen ---- */
#boot{position:fixed;inset:0;z-index:90;display:grid;place-items:center;
  background:radial-gradient(130% 100% at 50% 15%,#122822 0%,#07100c 55%,#030705 100%);
  transition:opacity .7s cubic-bezier(.16,1,.3,1), transform .7s cubic-bezier(.16,1,.3,1)}
#boot.done{opacity:0;transform:scale(1.03);pointer-events:none}
#boot .inner{width:min(440px,85vw);text-align:center;display:flex;flex-direction:column;align-items:center}
.boot-logo{position:relative;margin-bottom:18px;display:flex;align-items:center;justify-content:center;width:76px;height:76px}
.boot-ring{position:absolute;inset:0;margin:auto;width:68px;height:68px;border-radius:50%;
  border:1.5px solid rgba(95,208,122,.65);box-shadow:0 0 20px rgba(95,208,122,.3), inset 0 0 12px rgba(95,208,122,.15);
  transform:translateZ(0);will-change:transform,opacity;
  animation:bootRingPulse 2.4s infinite cubic-bezier(0.4, 0, 0.2, 1)}
.boot-ring::after{content:'';position:absolute;inset:-6px;border-radius:50%;
  border:1px solid rgba(95,208,122,.45);
  transform:translateZ(0);will-change:transform,opacity;
  animation:bootRingWave 2.4s infinite cubic-bezier(0.1, 0.5, 0.4, 1);
  animation-delay:0.5s;pointer-events:none}
.boot-ring::before{content:'';position:absolute;inset:2px;border-radius:50%;
  border-top:2px solid var(--turf);border-right:2px solid transparent;
  border-bottom:2px solid rgba(95,208,122,.2);border-left:2px solid transparent;
  transform:translateZ(0);will-change:transform;
  animation:bootSpin 3.5s infinite linear;pointer-events:none}
@keyframes bootRingPulse{
  0%{transform:scale(0.88) translateZ(0);opacity:0.4}
  50%{transform:scale(1.16) translateZ(0);opacity:1}
  100%{transform:scale(0.88) translateZ(0);opacity:0.4}
}
@keyframes bootRingWave{
  0%{transform:scale(0.85) translateZ(0);opacity:0.75}
  100%{transform:scale(1.6) translateZ(0);opacity:0}
}
@keyframes bootSpin{
  0%{transform:rotate(0deg) translateZ(0)}
  100%{transform:rotate(360deg) translateZ(0)}
}
#boot .mark{font:800 24px/1 Outfit,sans-serif;letter-spacing:-.02em;color:var(--ink);z-index:1}
#boot .mark i{font-style:normal;color:var(--turf);text-shadow:0 0 16px var(--turf)}
#boot h1{font-size:22px;font-weight:700;letter-spacing:-.01em;color:#ffffff;margin-top:4px}
#boot .sub{font-size:12px;color:var(--dim);margin-top:6px;letter-spacing:.08em;text-transform:uppercase}
#bar{width:100%;height:3px;background:rgba(255,255,255,.08);border-radius:3px;margin-top:26px;overflow:hidden;
  position:relative;box-shadow:inset 0 1px 2px rgba(0,0,0,.5)}
#bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#248b52,var(--turf),#a8f2ba);
  box-shadow:0 0 12px var(--turf);transition:width .35s ease-out;border-radius:3px}
.boot-status{display:flex;align-items:center;gap:7px;margin-top:12px;min-height:16px}
.status-pulse{width:6px;height:6px;border-radius:50%;background:var(--turf);box-shadow:0 0 8px var(--turf);
  transform:translateZ(0);will-change:opacity;animation:pulseDot 1.4s infinite}
@keyframes pulseDot{0%,100%{opacity:.4}50%{opacity:1}}
#bmsg{font-size:11.5px;color:var(--dim);letter-spacing:.02em}

/* ---- panels ---- */
.panel{position:fixed;z-index:20;background:var(--glass);backdrop-filter:blur(22px) saturate(1.25);
  -webkit-backdrop-filter:blur(22px) saturate(1.25);border:1px solid var(--edge);border-radius:15px;
  box-shadow:0 18px 46px rgba(0,0,0,.45)}

/* card */
#card{top:14px;left:50%;transform:translateX(-50%);padding:9px 12px;display:flex;gap:13px;align-items:center}
#card .no{font-size:26px;font-weight:800;line-height:1;min-width:34px;text-align:center}
#card .mid{display:flex;flex-direction:column;gap:2px}
#card .nm{font-size:12.5px;font-weight:600;white-space:nowrap;max-width:min(38vw,340px);overflow:hidden;text-overflow:ellipsis}
#card .pi{font-size:10px;color:var(--dim);letter-spacing:.05em}
#tees{display:flex;gap:5px}
.tee{padding:4px 7px;border-radius:8px;text-align:center;min-width:44px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);cursor:pointer;transition:all .15s}
.tee b{display:block;font-size:12.5px;font-weight:700;font-family:'JetBrains Mono',monospace}
.tee i{display:block;font-size:8px;font-style:normal;letter-spacing:.06em;opacity:.62;margin-top:1px}
.tee.on{background:rgba(95,208,122,.16);border-color:rgba(95,208,122,.45)}

/* right rail */
#rail{top:14px;right:14px;padding:9px;display:flex;flex-direction:column;gap:7px;width:200px}
.grp{display:flex;gap:5px}
.btn{flex:1;min-width:0;padding:6px 4px;border-radius:9px;border:1px solid rgba(255,255,255,.07);
  background:rgba(255,255,255,.04);color:var(--dim);font:600 10px/1.2 Outfit,sans-serif;
  cursor:pointer;text-align:center;letter-spacing:.04em;transition:.15s}
.btn:hover{background:rgba(255,255,255,.09);color:var(--ink)}
.btn.on{background:rgba(95,208,122,.17);border-color:rgba(95,208,122,.42);color:var(--turf)}
.lbl{font-size:8.5px;color:var(--faint);letter-spacing:.15em;text-transform:uppercase;margin:2px 0 -1px}
#facts{font-size:10px;color:var(--dim);line-height:1.55;padding-top:4px;border-top:1px solid rgba(255,255,255,.06)}
#facts b{color:var(--ink);font-family:'JetBrains Mono',monospace;font-weight:600}

/* note */
#note{bottom:76px;left:14px;max-width:330px;padding:10px 13px;font-size:11px;line-height:1.55;color:var(--dim)}
#note b{color:var(--ink);display:block;font-size:11.5px;margin-bottom:3px;letter-spacing:.02em}

/* panel head bar & close buttons */
.panel-head-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.panel-close-btn{display:none;width:22px;height:22px;border-radius:50%;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.07);color:var(--dim);font:600 13px/1 Outfit,sans-serif;align-items:center;
  justify-content:center;cursor:pointer;transition:all .15s}
.panel-close-btn:hover{background:rgba(255,255,255,.16);color:#fff}
.mini-head{display:none;align-items:center;justify-content:space-between;padding:0 2px 6px}
.mini-title{font:700 10.5px/1 Outfit,sans-serif;color:var(--turf);letter-spacing:.08em;text-transform:uppercase}

/* holes container & chevrons */
.holes-wrap{position:fixed;bottom:14px;left:50%;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:6px}
#holes{position:static;transform:none;padding:6px;display:flex;gap:3px}
.hb{width:29px;height:29px;border-radius:8px;border:1px solid transparent;background:transparent;
  color:var(--faint);font:600 11px/1 Outfit,sans-serif;cursor:pointer;transition:.13s}
.hb:hover{background:rgba(255,255,255,.07);color:var(--ink)}
.hb.on{background:var(--turf);color:#04140a;font-weight:800}
.hole-step-btn{width:29px;height:29px;border-radius:8px;background:var(--glass);backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);border:1px solid var(--edge);color:var(--dim);font:700 16px/1 Outfit,sans-serif;
  display:grid;place-items:center;cursor:pointer;transition:all .15s}
.hole-step-btn:hover{background:rgba(95,208,122,.2);color:var(--turf);border-color:rgba(95,208,122,.4)}

/* minimap */
#mini{bottom:14px;right:14px;width:186px;height:186px;padding:7px}
@media(min-width:1200px){#mini{width:232px;height:232px}}
#mini canvas{position:static;width:100%;height:100%;border-radius:9px}

#hint{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);z-index:19;font-size:10px;
  color:var(--faint);letter-spacing:.08em;pointer-events:none;transition:opacity .6s}

/* Mobile HUD Quick Actions */
.mobile-hud-cluster{display:none;position:fixed;z-index:21;right:calc(8px + env(safe-area-inset-right));
  bottom:calc(56px + env(safe-area-inset-bottom));padding:4px;border-radius:22px;background:var(--glass);
  backdrop-filter:blur(22px) saturate(1.25);-webkit-backdrop-filter:blur(22px) saturate(1.25);
  border:1px solid var(--edge);box-shadow:0 12px 32px rgba(0,0,0,.45);gap:3px;align-items:center;transition:opacity .35s}
.m-hud-btn{display:flex;align-items:center;gap:5px;padding:7px 11px;border-radius:18px;
  background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);color:var(--dim);
  font:600 11px/1 Outfit,sans-serif;cursor:pointer;transition:all .18s}
.m-hud-btn svg{color:inherit}
.m-hud-btn:hover,.m-hud-btn.on{background:rgba(95,208,122,.18);border-color:rgba(95,208,122,.45);color:var(--turf)}
.m-hud-btn.primary{background:rgba(95,208,122,.14);border-color:rgba(95,208,122,.35);color:var(--turf);font-weight:700}
.m-hud-btn:active{transform:scale(.95)}

/* ren vy: everything fades, the landscape stays. The ghost button brings it back. */
.panel,#hint,#uiToggle,#courseNav,.holes-wrap,.mobile-hud-cluster{transition:opacity .35s}
body.clean .panel,body.clean #hint,body.clean #uiToggle,body.clean #courseNav,body.clean .holes-wrap,body.clean .mobile-hud-cluster{opacity:0;pointer-events:none}
#cleanExit{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top));
  right:calc(10px + env(safe-area-inset-right));z-index:41;width:34px;height:34px;
  border-radius:17px;background:rgba(9,18,14,.5);border:1px solid var(--edge);
  color:var(--dim);font:600 15px/1 Outfit,sans-serif;cursor:pointer;opacity:.55}
body.clean #cleanExit{display:block}

/* the bansafari's letterbox and PGA Tour broadcast card */
body.tour::before,body.tour::after{content:"";position:fixed;left:0;right:0;height:6.5vh;
  background:#000;z-index:15;pointer-events:none}
body.tour::before{top:0}body.tour::after{bottom:0}

#tourCard {
  position: fixed;
  left: max(24px, env(safe-area-inset-left));
  bottom: max(20px, calc(6.5vh + 16px));
  z-index: 20;
  max-width: min(480px, calc(100vw - 40px));
  background: linear-gradient(135deg, rgba(8, 20, 14, 0.92) 0%, rgba(14, 28, 20, 0.84) 100%);
  backdrop-filter: blur(28px) saturate(1.3);
  -webkit-backdrop-filter: blur(28px) saturate(1.3);
  border: 1px solid rgba(95, 208, 122, 0.28);
  border-left: 4px solid var(--turf);
  border-radius: 16px;
  padding: 16px 20px 14px;
  box-shadow: 0 20px 48px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.05);
  opacity: 0;
  transform: translateY(12px);
  transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  pointer-events: none;
  color: var(--ink);
}
#tourCard.show {
  opacity: 1;
  transform: translateY(0);
}
.tour-elev-pill {
  font: 600 11px/1 Outfit, sans-serif;
  color: var(--dim);
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.10);
  padding: 4px 8px;
  border-radius: 6px;
  letter-spacing: 0.02em;
  white-space: nowrap;
}
.tour-hole-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
#tourCard .tno {
  font: 900 24px/1 Outfit, sans-serif;
  color: #fff;
  letter-spacing: -0.02em;
}
.tour-pills {
  display: flex;
  gap: 6px;
}
.tour-pill {
  font: 700 11px/1 Outfit, sans-serif;
  background: rgba(95, 208, 122, 0.16);
  border: 1px solid rgba(95, 208, 122, 0.35);
  color: var(--turf);
  padding: 4px 8px;
  border-radius: 6px;
  letter-spacing: 0.04em;
}
#tourCard .tnm {
  font: 700 16px/1.2 Outfit, sans-serif;
  color: rgba(255, 255, 255, 0.95);
  margin-top: 4px;
  letter-spacing: -0.01em;
}
#tourCard .ttx {
  font: 400 13px/1.55 Outfit, sans-serif;
  color: rgba(255, 255, 255, 0.82);
  margin-top: 8px;
  max-height: 120px;
  overflow-y: auto;
  text-shadow: 0 1px 4px rgba(0, 0, 0, 0.7);
}
.tour-progress-bar {
  margin-top: 12px;
  padding-top: 10px;
  border-top: 1px solid rgba(255, 255, 255, 0.08);
}
.tour-progress-track {
  width: 100%;
  height: 4px;
  border-radius: 2px;
  background: rgba(255, 255, 255, 0.12);
  overflow: hidden;
}
.tour-progress-fill {
  width: 0%;
  height: 100%;
  background: linear-gradient(90deg, #10b981, #5fd07a);
  box-shadow: 0 0 10px rgba(95, 208, 122, 0.8);
  border-radius: 2px;
  transition: width 0.1s linear;
}
.tour-progress-labels {
  display: flex;
  justify-content: space-between;
  margin-top: 4px;
  font: 700 9.5px/1 Outfit, sans-serif;
  color: var(--faint);
  letter-spacing: 0.1em;
}
@media (max-width: 620px) {
  #tourCard {
    left: 12px;
    right: 12px;
    bottom: max(12px, calc(6.5vh + 8px));
    max-width: none;
    padding: 12px 14px 10px;
  }
  #tourCard .tno { font-size: 20px; }
  #tourCard .tnm { font-size: 14px; }
  #tourCard .ttx { font-size: 12px; line-height: 1.45; max-height: 80px; }
}

/* kikaren's readout */
#kikOut{display:none;bottom:180px;left:14px;max-width:300px;padding:9px 12px;
  font-size:11px;line-height:1.6;color:var(--dim)}
#kikOut.show{display:block}
#kikOut b{color:var(--ink);font-family:'JetBrains Mono',monospace;font-weight:600}
@media(max-width:980px){#kikOut{bottom:auto;top:calc(64px + env(safe-area-inset-top));left:8px}}

#toast{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));
  transform:translateX(-50%);z-index:40;padding:9px 14px;border-radius:11px;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.25);
  -webkit-backdrop-filter:blur(22px) saturate(1.25);border:1px solid var(--edge);
  font-size:11.5px;color:var(--ink);opacity:0;pointer-events:none;transition:opacity .4s;
  max-width:86vw;text-align:center}
#toast.show{opacity:1;pointer-events:auto}
#toast a{color:var(--turf)}

#v2TerrainBadge{position:fixed;left:14px;top:72px;z-index:18;display:flex;
  flex-direction:column;gap:2px;padding:8px 11px;border-radius:10px;
  background:rgba(8,20,13,.78);border:1px solid rgba(128,217,145,.28);
  box-shadow:0 8px 28px rgba(0,0,0,.28);backdrop-filter:blur(16px) saturate(1.2);
  -webkit-backdrop-filter:blur(16px) saturate(1.2);pointer-events:none}
#v2TerrainBadge[hidden],body.clean #v2TerrainBadge{display:none}
#v2TerrainBadge b{font:700 10px/1.2 'JetBrains Mono',monospace;letter-spacing:.08em;color:#9af0aa}
#v2TerrainBadge span{font-size:10px;line-height:1.25;color:var(--dim)}
#v2TerrainBadge[data-state="fallback"]{border-color:rgba(226,178,89,.35)}
#v2TerrainBadge[data-state="fallback"] b{color:#efc676}
@media(max-width:700px){#v2TerrainBadge{left:8px;top:calc(64px + env(safe-area-inset-top));
  max-width:calc(100vw - 16px);padding:7px 9px}}

/* Responsive Breakpoints & Mobile Intelligence */
@media(max-width:980px){
  #mini,#note{display:none}
  .mobile-hud-cluster{display:flex}
  #mini.mobile-open{display:flex;flex-direction:column;position:fixed;z-index:44;
    bottom:calc(100px + env(safe-area-inset-bottom));right:calc(8px + env(safe-area-inset-right));
    width:min(280px,calc(100vw - 16px));height:min(280px,calc(100vw - 16px));padding:8px;
    border-radius:18px;box-shadow:0 22px 50px rgba(0,0,0,.7)}
  #mini.mobile-open .mini-head{display:flex}
  #mini.mobile-open .panel-close-btn{display:flex}
  #note.mobile-open{display:block;position:fixed;z-index:44;bottom:calc(100px + env(safe-area-inset-bottom));
    left:calc(8px + env(safe-area-inset-left));right:calc(8px + env(safe-area-inset-right));
    max-width:min(360px,calc(100vw - 16px));max-height:45vh;overflow-y:auto;padding:12px 14px;
    border-radius:16px;box-shadow:0 22px 50px rgba(0,0,0,.7)}
  #note.mobile-open .panel-close-btn{display:flex}
}

@media(max-width:768px){
  /* Top HUD: Never collide #courseNav and #card */
  #card{top:calc(8px + env(safe-area-inset-top));left:auto;right:calc(8px + env(safe-area-inset-right));
    transform:none;gap:8px;padding:6px 10px;max-width:calc(100vw - 156px);height:40px}
  #card .no{font-size:19px;min-width:22px}
  #card .mid{min-width:0;flex:0 1 auto}
  #card .nm{font-size:11px;max-width:72px;overflow:hidden;text-overflow:ellipsis}
  #card .pi{font-size:9px}
  #tees{overflow-x:auto;flex:1;margin-left:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;display:flex;gap:4px}
  #tees::-webkit-scrollbar{display:none}
  #tees .tee{flex:0 0 auto;padding:2px 6px;min-width:38px;border-radius:6px}
  #tees .tee b{font-size:11px}
  #tees .tee i{font-size:7.5px}

  /* Mobile Sheet for Rail */
  #rail{display:none}
  #rail.open{display:flex;position:fixed;top:auto;left:0;right:0;bottom:0;width:100%;
    max-height:76vh;overflow-y:auto;border-radius:22px 22px 0 0;border:1px solid var(--edge);border-bottom:none;
    background:radial-gradient(130% 100% at 50% 0%,rgba(14,30,22,.97),rgba(5,12,9,.99) 70%,#020504);
    padding:14px 18px calc(20px + env(safe-area-inset-bottom));box-shadow:0 -14px 44px rgba(0,0,0,.75);
    z-index:45;gap:9px}
  #rail.open .btn{padding:9px 6px;font-size:11.5px;border-radius:10px}
  #rail.open #facts{display:block;font-size:11px;line-height:1.6;padding-top:8px;margin-top:4px}
  #facts{display:none}
  #hint{display:none}

  /* Bottom Hole Selector on Mobile: Smooth Carousel */
  .holes-wrap{bottom:calc(8px + env(safe-area-inset-bottom));left:8px;right:8px;transform:none;
    justify-content:center;max-width:none}
  #holes{max-width:calc(100vw - 84px);overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;
    scroll-snap-type:x mandatory;gap:4px;padding:4px 6px;border-radius:12px}
  #holes::-webkit-scrollbar{display:none}
  .hb{width:34px;height:34px;min-width:34px;border-radius:9px;font-size:12px;scroll-snap-align:center}
  .hole-step-btn{width:34px;height:34px;min-width:34px;border-radius:9px;font-size:18px}
}

@media(max-width:480px){
  #card .nm{display:none}
}
</style>
</head>
<body>

<div id="boot"><div class="inner">
  <div class="boot-logo">
    <div class="boot-ring"></div>
    <div class="mark">Ban<i>v</i>y</div>
  </div>
  <h1 id="bootTitle">Banvy 3D</h1>
  <p class="sub" id="bootSub">Svenska golfbanor i realtid</p>
  <div id="bar"><i></i></div>
  <div class="boot-status">
    <span class="status-pulse"></span>
    <span id="bmsg">startar</span>
  </div>
</div></div>

<script>
(function () {
  var booting = function () {
    var b = document.getElementById('boot');
    return b && !b.classList.contains('done');
  };
  var say = function (msg, onlyIdle) {
    var m = document.getElementById('bmsg');
    if (!m || !booting()) return;
    if (onlyIdle && m.textContent !== 'startar') return;
    m.textContent = msg;
  };
  if (!(window.HTMLScriptElement && HTMLScriptElement.supports &&
        HTMLScriptElement.supports('importmap')) ||
      typeof DecompressionStream === 'undefined') {
    say('webbläsaren är för gammal för den här sidan — uppdatera till iOS 16.4 / en nyare webbläsare');
    return;
  }
  var t = setTimeout(function () {
    say('tar ovanligt länge — sidan hämtar ~1,5 MB grafik första gången; kontrollera anslutningen', true);
  }, 12000);
  /* Banvy is installable, so being offline is a normal state rather than an
     error state -- a course already opened runs with no network at all. What a
     person cannot do offline is open a course they have never opened, because
     its 400 KB pack was never fetched to be cached. That is a sentence, not a
     TypeError: "Failed to fetch" tells someone standing on a tee with no signal
     nothing they can act on. */
  /* The loader already phrases its own failures in words a person can act on
     (see src/loader/pack.js), because it is the only thing that knows which
     fetch died. Anything already written for a reader is shown as-is; only the
     genuinely internal errors get the "fel vid start" prefix. Do NOT reach for
     navigator.onLine here -- it says whether a network interface exists, not
     whether anything answers, and it stays true on a dead cell. */
  var explain = function (msg) {
    msg = String(msg || 'okänt fel')
      .replace(/^Uncaught(?: \(in promise\))?(?: [A-Za-z]*Error)?:\s*/, '');
    /* a message the loader wrote for a reader starts lower-case and has spaces
       in it; anything else is an internal fault and says so */
    return /^[a-zåäö]/.test(msg) && msg.indexOf(' ') > 0 ? msg : 'fel vid start: ' + msg;
  };
  window.addEventListener('error', function (e) {
    if (e && e.target && e.target.tagName === 'SCRIPT') {
      clearTimeout(t);
      say('kunde inte hämta moduler — kontrollera anslutningen och ladda om');
    } else if (e && e.message) {
      clearTimeout(t);
      say(explain(e.message));
    }
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    clearTimeout(t);
    var r = e && e.reason;
    say(explain(r && r.message ? r.message : String(r)));
  });
}());
</script>
