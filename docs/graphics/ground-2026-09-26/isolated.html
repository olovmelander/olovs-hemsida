<body style="margin:0;background:#000">
<script type="module">

}
const THREE = await import('three/webgpu');
const { uniform, color, float, mix, texture, positionWorld, positionGeometry, cameraPosition, normalize, pow, saturate } = await import('three/tsl');
const { createAtmosphericSky, setAtmospherePreset, setSkyGroundHaze } = await import('/apps/golf/src/engine/atmospheric-sky.mjs');
const { ATMOSPHERE_PRESETS } = await import('/apps/golf/src/engine/atmosphere-presets.mjs');
const { paintedAtmosphere, PAINTED_GROUND, PAINTED_SCENERY } = await import('/apps/golf/src/engine/painted-world-palette.mjs');
const { setPaintedWorldLighting } = await import('/apps/golf/src/engine/painted-world-lighting.mjs');
const { createGroundAtlas } = await import('/apps/golf/src/engine/atlas.js');
const { SURFACE } = await import('/apps/golf/src/engine/surface.js');
const { createPackedGroundDetailTexture } = await import('/apps/golf/src/engine/ground-detail-upload.mjs');
const { fillGroundDetailPixels } = await import('/apps/golf/src/engine/ground-detail-texture.mjs');
const { hash2 } = await import('/apps/golf/src/engine/geom.js');
const cover = await import('/apps/golf/src/engine/ground-cover.mjs');
const NOW = await import('/apps/golf/src/engine/material.js');
/* main's ground material, generated from git by check-isolated.mjs */
let MAIN = null;
try { MAIN = await import('./main-material.gen.mjs'); } catch (e) { console.warn('main material missing', e); }

const params = new URLSearchParams(location.search);
const backend = params.get('backend') || 'webgl2';
const W = +(params.get('w') || 480), H = +(params.get('h') || 272);
const frame = () => new Promise(r => requestAnimationFrame(r));
const painted = name => paintedAtmosphere(name, ATMOSPHERE_PRESETS[name]);
const finalFog = p => new THREE.Color(p.fog).lerp(new THREE.Color(p.paintedFog), 0.22);
const b64 = f => { const u = new Uint8Array(f.buffer); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode(...u.subarray(i, i + 0x8000)); return btoa(s); };

try {
  /* as the app: 4x MSAA, HalfFloat output, reversed depth on WebGPU only (main.js) */
  const renderer = new THREE.WebGPURenderer({ antialias: true, samples: 4, outputBufferType: THREE.HalfFloatType,
    forceWebGL: backend === 'webgl2', reversedDepthBuffer: backend === 'webgpu' });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFShadowMap;
  document.body.appendChild(renderer.domElement);
  await renderer.init();
  const target = new THREE.RenderTarget(W, H, { type: THREE.HalfFloatType, depthBuffer: true, samples: 4 });
  /* the linear colour before exposure and tone mapping, settled: two renders in a row agree */
  const settle = async (scene, camera) => {
    await renderer.compileAsync(scene, camera);
    let last = null, renders = 0, settled = false;
    while (!settled && renders < 6) {
      renderer.setRenderTarget(target);
      renderer.render(scene, camera);
      renderer.setRenderTarget(null);
      const now = await renderer.readRenderTargetPixelsAsync(target, 0, 0, W, H);
      renders++;
      settled = last !== null && now.every((v, k) => v === last[k]);
      last = now;
      if (!settled) await frame();

    return { px: b64(Float32Array.from(last, THREE.DataUtils.fromHalfFloat)), renders, settled };
  };

    await renderer.compileAsync(scene, camera);
    for (let i = 0; i < 3; i++) { renderer.render(scene, camera); await frame(); }
  };

    const d = new THREE.Vector3(...sunDir).normalize();
    sun.color.setHex(p.sun); sun.intensity = p.int; sun.position.copy(sun.target.position).addScaledVector(d, 150);
    hemi.color.setHex(p.hemiS); hemi.groundColor.setHex(p.hemiG); hemi.intensity = p.hemiI * (p.paintedFill ?? 1);

  /* THE HOLE: a par 4 on the app's own exact-edge atlas at its own 1 m, with the
     app's painted palette and SHADE table (main.js): a tee, a fairway 44 m wide
     that widens to 92 m between 190 and 270 m, a fairway bunker, a green in its
     collar between two bunkers at 375 m, a cart path along the fairway's right
     edge and another running down the view, a road across at 20 m, and a patch of
     mud in the rough. The hole's line runs down +z from the tee. */
  const Lin = hex => { const c = new THREE.Color(hex); return [c.r, c.g, c.b]; };

    [SURFACE.ROUGH]: [0.62, 1.25, 0.06, 0], [SURFACE.SEMI]: [1.15, 0.62, 0.17, 0.5],
    [SURFACE.FAIRWAY]: [1.55, 0.44, 0.28, 1.15], [SURFACE.GREEN]: [2.85, 0.13, 0.54, 0.9],
    [SURFACE.FRINGE]: [2.0, 0.30, 0.34, 0.9], [SURFACE.TEE]: [2.2, 0.22, 0.40, 1.3],
    [SURFACE.SAND]: [2.3, 0.58, 0.14, 0], [SURFACE.PATH]: [3.2, 0.34, 0.18, 0],
    [SURFACE.ASPHALT]: [3.0, 0.2, 0.2, 0], [SURFACE.MUD]: [2.0, 0.5, 0.3, 0],

    fairway: [[-22, 40], [22, 40], [22, 190], [46, 190], [46, 270], [22, 270], [22, 340], [-22, 340], [-22, 270], [-46, 270], [-46, 190], [-22, 190]],
    green: [0, 375, 15], fringe: [0, 375, 17.5], bunkers: [[-21, 366, 5], [21, 388, 6], [12, 150, 4]],
    pathBeside: [22, 60, 25.5, 130], pathDown: [34, 0, 37, 480], road: [-80, 20, 80, 26], mud: [-70, 110, -50, 140], tee: [-4, -6, 4, 2],
  };
  const holeAtlas = createGroundAtlas({ CORE: { x0: -120, z0: -30, x1: 120, z1: 520 }, res: 1,
    HOLES: [{ n: 1, line: [[0, -2], [0, 375]] }], features: [

      { surface: SURFACE.GREEN, rings: [circle(...HOLE.green)] },
      { surface: SURFACE.FRINGE, rings: [circle(...HOLE.fringe)] },
      { surface: SURFACE.SAND, rings: HOLE.bunkers.map(b => circle(...b, 40)) },
      { surface: SURFACE.PATH, rings: [square(...HOLE.pathBeside), square(...HOLE.pathDown)] },
      { surface: SURFACE.ASPHALT, rings: [square(...HOLE.road)] },
      { surface: SURFACE.MUD, rings: [square(...HOLE.mud)] },
      { surface: SURFACE.TEE, rings: [square(...HOLE.tee)] },

  const uGroundSun = uniform(new THREE.Vector3(0, 1, 0));

  for (let k = 0; k < TN * TN; k++) tintData.set([(roughHex >> 16) & 255, (roughHex >> 8) & 255, roughHex & 255, 128], k * 4);
  const tintTexture = new THREE.DataTexture(tintData, TN, TN, THREE.RGBAFormat, THREE.UnsignedByteType);
  Object.assign(tintTexture, { colorSpace: THREE.SRGBColorSpace, minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter, generateMipmaps: false, flipY: false, needsUpdate: true });
  const GTINT = { near: { texture: tintTexture, bounds: { x0: -600, z0: -600, x1: 600, z1: 1400 }, fadeMetres: 8 } };
  const holeScene = new THREE.Scene();
  holeScene.background = new THREE.Color(0xff00ff);
  const holeSun = new THREE.DirectionalLight(0xffffff, 3), holeHemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1);

  const plane = new THREE.PlaneGeometry(1200, 2000, 120, 200).rotateX(-Math.PI / 2).translate(0, 0, 400);
  const holeMeshes = {};
  /* version: 'main' (main's module), 'before' (every switch off) or 'now'; debug: the weights' categorical colours */
  const holeMesh = ({ version, debug = false, mowStrength = 1, cutTone = 1 }) => {
    const key = `${version}-${debug}-${mowStrength}-${cutTone}`;
    if (holeMeshes[key]) return holeMeshes[key];

    const on = version === 'now';
    const decorate = module.createV2GroundMaterialDecorator({ atlas: holeAtlas, DETAIL: GDETAIL, C: GC, SHADE: GSHADE, uSun: uGroundSun, tint: GTINT,
      cutTone, mowStrength, surfaceGloss: true, surfaceEdges: true, groundRelief: true, debugMode: debug ? 'weights' : 'off',

  };
  const VIEWS = {
    /* the app's tee camera (mow-fade.test.mjs): 1.7 m over the tee, down the hole */
    tee: () => { const c = new THREE.PerspectiveCamera(48, W / H, 1, 14000); c.position.set(0, 1.7, 0); c.lookAt(0, 3, 260); return c; },
    /* the app's hole view (main.js setCam): behind and above the tee, looking down the hole to 40% of its length */
    overview: () => { const c = new THREE.PerspectiveCamera(48, W / H, 1, 14000); c.position.set(-26, 41, -73.5); c.lookAt(0, 4, 150); return c; },
    /* the wide section of fairway from straight above, north up the screen: 104 m across */
    wide: () => { const c = new THREE.OrthographicCamera(-52, 52, 52 * H / W, -52 * H / W, 1, 500); c.position.set(0, 200, 230); c.up.set(0, 0, 1); c.lookAt(0, 0, 230); return c; },
    /* the fairway's right edge and the path beside it, from straight above: 8 m across */
    beside: () => { const c = new THREE.OrthographicCamera(-4, 4, 4 * H / W, -4 * H / W, 1, 500); c.position.set(23, 200, 95); c.up.set(0, 0, 1); c.lookAt(23, 0, 95); return c; },
    /* the mud patch, from 25 m above its edge */
    mud: () => { const c = new THREE.PerspectiveCamera(40, W / H, 1, 2000); c.position.set(-45, 25, 95); c.lookAt(-60, 0, 125); return c; },
  };
  const cameras = {};
  /* placed now: __ground unprojects through a camera that may not have drawn yet */
  const camera = view => (cameras[view] ??= (c => { c.updateMatrixWorld(true); return c; })(VIEWS[view]()));
  const setHole = ({ version, debug, preset = 'noon', mowStrength, cutTone, sky = false }) => {
    const p = painted(preset);
    setPaintedWorldLighting(p, preset);
    uGroundSun.value.copy(light(holeSun, holeHemi, p));
    /* the classes' colours alone: no light to glint off the black they are drawn on */
    if (debug) holeSun.intensity = holeHemi.intensity = 0;
    setAtmospherePreset(holeSky, p); setSkyGroundHaze(holeSky, finalFog(p));
    for (const m of Object.values(holeMeshes)) holeScene.remove(m);

    holeSky.visible = sky;
  };
  window.__hole = async o => { setHole(o); return settle(holeScene, camera(o.view || 'tee')); };
  window.__showHole = async o => { setHole({ ...o, sky: true }); await show(holeScene, camera(o.view || 'tee')); return true; };

  window.__ground = view => {
    const c = camera(view), out = new Float32Array(W * H * 2), v = new THREE.Vector3(), o = new THREE.Vector3();
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      v.set((x + 0.5) / W * 2 - 1, 1 - (y + 0.5) / H * 2, 0.5).unproject(c);
      if (c.isOrthographicCamera) { o.set((x + 0.5) / W * 2 - 1, 1 - (y + 0.5) / H * 2, -1).unproject(c); v.sub(o).normalize(); }
      else { o.copy(c.position); v.sub(o).normalize(); }
      const t = -o.y / v.y, i = (y * W + x) * 2;
      out[i] = t > 0 ? o.x + v.x * t : NaN; out[i + 1] = t > 0 ? o.z + v.z * t : NaN;
    }

  };

  /* THE COVER: tussocks, the mown edge's clumps, reeds and stones on a rough
     ground, built from the app's own blades and cover rules (ground-cover.mjs)
     with main.js's materials, before and with the batch, and a block standing
     in as a tree to throw a shadow across the tussocks */
  const coverScene = new THREE.Scene();
  coverScene.background = new THREE.Color(0xff00ff);
  const coverSun = new THREE.DirectionalLight(0xffffff, 3), coverHemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
  coverSun.castShadow = true;
  coverSun.shadow.mapSize.set(2048, 2048);
  Object.assign(coverSun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 400 });
  coverSun.shadow.bias = -0.0004; coverSun.shadow.normalBias = 0.05;
  coverSun.target.position.set(0, 0, 14);
  coverScene.add(coverSun, coverSun.target, coverHemi);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(400, 400).rotateX(-Math.PI / 2),
    new THREE.MeshStandardNodeMaterial({ color: new THREE.Color(PAINTED_GROUND.rough), roughness: 0.95 }));
  floor.receiveShadow = true;
  const block = new THREE.Mesh(new THREE.BoxGeometry(3, 9, 3), new THREE.MeshStandardNodeMaterial({ color: 0x2c4a2a, roughness: 0.9 }));
  block.castShadow = true;
  coverScene.add(floor, block);
  const uSun = uniform(new THREE.Vector3(0, 1, 0)), uSunThrough = uniform(1), uAutumn = uniform(0), uReedC = uniform(new THREE.Color(0x8d8a52));
  /* the detail texture as the cover's colours were tuned on: through a 2D canvas's premultiplied alpha (until 24 September) */
  const canvasDetail = (() => {
    const px = new Uint8ClampedArray(512 * 512 * 4);
    fillGroundDetailPixels(px, 512, { seamless: true });
    for (let i = 0; i < px.length; i += 4) {
      const A = px[i + 3];
      for (let c = 0; c < 3; c++) px[i + c] = A ? Math.min(255, Math.round(Math.round(px[i + c] * A / 255) * 255 / A)) : 0;
    }
    const t = new THREE.DataTexture(new Uint8Array(px.buffer), 512, 512);
    Object.assign(t, { wrapS: THREE.RepeatWrapping, wrapT: THREE.RepeatWrapping, minFilter: THREE.LinearMipmapLinearFilter, magFilter: THREE.LinearFilter,
      generateMipmaps: true, anisotropy: 8, flipY: true, needsUpdate: true });
    return t;
  })();
  const geometry = ({ positions, normals }, front) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    g.setAttribute('normal', new THREE.Float32BufferAttribute(front ? cover.bladeNormalsFront(normals) : normals, 3));
    return g;
  };
  /* main.js's materials: `light`, `colour` the batch's switches; `detail` the texture the colours read */
  const coverMaterials = ({ light, colour, detail }) => {
    const V = normalize(cameraPosition.sub(positionWorld));
    const share = n => (colour ? n.mul(cover.COVER_TUNED_SHARE) : n);
    const tuft = new THREE.MeshStandardNodeMaterial({ side: THREE.DoubleSide, roughness: 0.95, metalness: 0 });
    {
      const lit = pow(saturate(V.dot(uSun.negate())), 2.4).mul(0.55).mul(uSunThrough);
      const tint = texture(detail, positionWorld.xz.mul(0.03)).b;
      const c = mix(color(PAINTED_SCENERY.tuft[0]), mix(color(PAINTED_SCENERY.tuft[1]), uReedC, uAutumn), share(tint)).mul(float(1).add(lit.mul(0.45)));
      tuft.colorNode = colour ? cover.grassCover(c) : c;
      if (light) tuft.normalNode = cover.seenBladeNormal();
    }
    const clump = new THREE.MeshStandardNodeMaterial({ side: THREE.DoubleSide, roughness: 0.95, metalness: 0 });
    {
      const lit = pow(saturate(V.dot(uSun.negate())), 2.4).mul(0.55).mul(uSunThrough);
      const tone = texture(detail, positionWorld.xz.mul(0.05)).b;
      const c = mix(color(0x3f6a24), color(0x7aa23e), saturate(positionGeometry.y.mul(3.2)).mul(0.7).add(share(tone).mul(0.3))).mul(float(1).add(lit.mul(0.45)));
      clump.colorNode = colour ? cover.grassCover(c) : c;
      if (light) clump.normalNode = cover.seenBladeNormal();
    }
    const reed = new THREE.MeshStandardNodeMaterial({ side: THREE.DoubleSide, roughness: 0.9, metalness: 0 });
    {
      const lit = pow(saturate(V.dot(uSun.negate())), 2.2).mul(0.7).mul(uSunThrough);
      reed.colorNode = mix(color(0x53583a), uReedC, saturate(positionGeometry.y.div(2.1)).mul(0.7)).mul(float(1).add(lit));
      if (light) reed.normalNode = cover.seenBladeNormal();
    }
    const stone = new THREE.MeshStandardNodeMaterial({ color: new THREE.Color(PAINTED_SCENERY.stone), roughness: 0.86, metalness: 0, flatShading: true });
    return { tuft, clump, reed, stone };
  };
  /* the planting: a field of tussocks 20 by 14 m in front of the eye, the clumps' fringe along its near edge, reeds behind, a few stones */
  const TUFTS = [], CLUMPS = [], REEDS = [], STONES = [];
  for (let x = -10; x <= 10; x += 0.62) for (let z = 7; z <= 21; z += 0.62) {
    const px = x + (hash2(x * 7 + 1, z * 3) - 0.5) * 0.4, pz = z + (hash2(z * 5, x * 11 + 2) - 0.5) * 0.4;
    TUFTS.push([px, pz, 0.6 + hash2(px * 13, pz * 17) * 0.9, hash2(px * 3, pz * 29) * Math.PI * 2]);
  }
  for (let x = -10; x <= 10; x += 0.18) for (const z of [5.2, 5.5, 5.8]) CLUMPS.push([x + hash2(x * 5, z) * 0.1, z + hash2(z, x * 3) * 0.2, 0.55 + hash2(x, z * 7) * 0.6, hash2(x * 9, z * 2) * Math.PI * 2]);
  for (let x = -12; x <= 12; x += 0.5) REEDS.push([x + hash2(x, 1) * 0.3, 24 + hash2(x * 3, 2) * 1.5, 0.5 + hash2(x, 3) * 0.4, hash2(x, 4) * Math.PI * 2]);
  for (const [x, z] of [[-6, 10], [3, 12], [7, 17], [-2, 18]]) STONES.push([x, z, 1.2, hash2(x, z) * Math.PI * 2]);
  const instanced = (geo, mat, list, shadow) => {
    const im = new THREE.InstancedMesh(geo, mat, list.length), m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), v = new THREE.Vector3(), s = new THREE.Vector3();
    list.forEach(([x, z, sc, rot], k) => {
      v.set(x, 0, z); s.set(sc, sc * (0.8 + (k % 5) * 0.09), sc); q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), rot);

  const coverSet = ({ light = false, colour = false, shadow = false, detail = 'packed' }) => {
    const key = `${light}-${colour}-${shadow}-${detail}`;
    if (coverSets[key]) return coverSets[key];
    const m = coverMaterials({ light, colour, detail: detail === 'canvas' ? canvasDetail : GDETAIL });
    const group = new THREE.Group();
    const parts = {
      tufts: instanced(geometry(cover.tussockBlades(), light), m.tuft, TUFTS, shadow),
      clumps: instanced(geometry(cover.clumpBlades(), false), m.clump, CLUMPS, shadow),
      reeds: instanced(geometry(cover.reedBlades(), light), m.reed, REEDS, shadow),

  };
  const coverView = new THREE.PerspectiveCamera(50, W / H, 0.1, 2000);
  coverView.position.set(0, 1.7, 0); coverView.lookAt(0, 0.3, 14);
  /* the sun at the preset's height from `bearing` degrees round from behind the eye (0: behind, 180: ahead) */
  const setCover = ({ light: lightOn, colour, shadow, detail, preset = 'golden', bearing = 0, block: withBlock = true, mask = null }) => {
    const p = painted(preset);
    setPaintedWorldLighting(p, preset);
    const up = p.dir[1] / Math.hypot(...p.dir), flat = Math.sqrt(1 - up * up), b = bearing * Math.PI / 180;

    coverScene.add(set.group);
    /* the block stands at the field's near right corner: under a sun behind the eye and to the right
       (bearing 45) its shadow falls ahead and to the left, across the tussocks */
    block.position.set(4, 4.5, 6);
    block.visible = withBlock;
    /* a mask pass: every population in its own flat colour, the ground black */
    const originals = new Map();
    if (mask) {
      const flatColour = hex => new THREE.MeshBasicNodeMaterial({ color: hex, side: THREE.DoubleSide });
      const colours = { tufts: 0xff0000, clumps: 0x00ff00, reeds: 0x0000ff, stones: 0xffff00 };
      for (const [name, part] of Object.entries(set.parts)) { originals.set(part, part.material); part.material = flatColour(colours[name]); }

      originals.set(block, block.material); block.material = flatColour(0xffffff);
    }
    return () => { for (const [mesh, material] of originals) mesh.material = material; };
  };
  window.__cover = async o => { const restore = setCover(o); try { return await settle(coverScene, coverView); } finally { restore(); } };
  window.__showCover = async o => { setCover(o); await show(coverScene, coverView); return true; };

  window.__result = { backend, W, H, ready: true, main: !!MAIN, hole: HOLE,
    counts: { tufts: TUFTS.length, clumps: CLUMPS.length, reeds: REEDS.length, stones: STONES.length } };
} catch (error) {
  window.__result = { backend, error: String(error && error.stack || error) };
}
</script>
</body>
