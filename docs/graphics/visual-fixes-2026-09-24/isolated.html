<!doctype html>
<meta charset="utf-8">
<link rel="icon" href="data:,">
<title>Visual fixes: isolated sky order and dither</title>
<!-- The app's own sky and output modules in an isolated scene: the painted
     golden sky and a hill over the lower frame, drawn with the sky first (the
     before) and last, with and without the output dither. Served from the
     repository root by check-isolated.mjs. -->
<script type="importmap">
{ "imports": {
  "three": "/apps/golf/node_modules/three/build/three.webgpu.js",
  "three/webgpu": "/apps/golf/node_modules/three/build/three.webgpu.js",
  "three/tsl": "/apps/golf/node_modules/three/build/three.tsl.js",
  "three/addons/": "/apps/golf/node_modules/three/examples/jsm/"
} }
</script>
<body style="margin:0;background:#000">
<script type="module">
/* A Chromium that predates the string form of the view swizzle three r186 sends
   rejects the identity one (as studies/tree-shadow-proof.mjs); a current Chrome needs nothing. */
if (globalThis.GPUTexture) {
  const createView = GPUTexture.prototype.createView;
  GPUTexture.prototype.createView = function (d) { if (d && d.swizzle === 'rgba') { d = { ...d }; delete d.swizzle; } return createView.call(this, d); };
}
const THREE = await import('three/webgpu');
const { createAtmosphericSky, setAtmospherePreset, SKY_RENDER_ORDER } = await import('/apps/golf/src/engine/atmospheric-sky.mjs');
const { ATMOSPHERE_PRESETS } = await import('/apps/golf/src/engine/atmosphere-presets.mjs');
const { paintedAtmosphere } = await import('/apps/golf/src/engine/painted-world-palette.mjs');
const { installOutputDither } = await import('/apps/golf/src/engine/output-dither.mjs');

const backend = new URLSearchParams(location.search).get('backend') || 'webgl2';
const W = 192, H = 144;
const frame = () => new Promise(r => requestAnimationFrame(r));

try {
  /* as the app: 4x MSAA, HalfFloat output, reversed depth on WebGPU only (main.js).
     One renderer for every variant: a device per variant lost the software adapter. */
  const renderer = new THREE.WebGPURenderer({ antialias: true, samples: 4, outputBufferType: THREE.HalfFloatType,
    forceWebGL: backend === 'webgl2', reversedDepthBuffer: backend === 'webgpu' });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H);
  document.body.appendChild(renderer.domElement);
  await renderer.init();
  installOutputDither(renderer);
  const p = paintedAtmosphere('golden', ATMOSPHERE_PRESETS.golden);
  renderer.toneMappingExposure = p.exp;
  const scene = new THREE.Scene();
  /* magenta: any pixel neither the sky nor the hill covers shows */
  scene.background = new THREE.Color(0xff00ff);
  const camera = new THREE.PerspectiveCamera(48, W / H, 1, 14000);
  camera.position.set(0, 2, 0);
  camera.lookAt(0, 8, -100);
  const sky = createAtmosphericSky({ reversedDepth: renderer.reversedDepthBuffer, deterministic: true, painted: true });
  setAtmospherePreset(sky, p);
  scene.add(sky);
  const hill = new THREE.Mesh(new THREE.PlaneGeometry(4000, 120), new THREE.MeshBasicNodeMaterial({ color: new THREE.Color(0x2f6a3a) }));
  hill.position.set(0, -30, -400);
  scene.add(hill);
  /* one variant on screen: the runner screenshots the presented canvas (a WebGPU
     canvas cannot be read back into 2D in a later task) and hands the PNG back
     to __decode, the browser's own decoder */
  window.__show = async name => {
    const [order, tone] = name.split('-');
    sky.renderOrder = order === 'last' ? SKY_RENDER_ORDER : -2;
    renderer.toneMapping = tone === 'dither' ? THREE.CustomToneMapping : THREE.ACESFilmicToneMapping;
    await renderer.compileAsync(scene, camera);
    for (let i = 0; i < 3; i++) { renderer.render(scene, camera); await frame(); }
    return sky.renderOrder;
  };
  window.__decode = async base64 => {
    const image = new Image();
    image.src = `data:image/png;base64,${base64}`;
    await image.decode();
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(image, 0, 0, W, H);
    return Array.from(g.getImageData(0, 0, W, H).data);
  };
  /* the draw order read straight from a 4x multisampled target: no output transform,
     but the same depth convention -- reversed on WebGPU -- and the same sky and hill */
  const target = new THREE.RenderTarget(W, H, { type: THREE.UnsignedByteType, depthBuffer: true, samples: 4 });
  window.__readTarget = async order => {
    sky.renderOrder = order === 'last' ? SKY_RENDER_ORDER : -2;
    renderer.setRenderTarget(target);
    renderer.render(scene, camera);
    renderer.setRenderTarget(null);
    const bytes = new Uint8Array(await renderer.readRenderTargetPixelsAsync(target, 0, 0, W, H));
    if (bytes.length !== W * H * 4) throw new Error(`unexpected readback size ${bytes.length}`);
    return Array.from(bytes);
  };
  /* the changed shaders, compiled and drawn by this backend: the striped ground with
     both stripe fades, and an instanced stump coloured by its height -- the template's
     (the fix) and the instanced positionLocal's (the before) -- at 0 and 50 m */
  window.__shaders = async () => {
    const { positionGeometry, positionLocal, mix, color, smoothstep, sin, time, vec3, uniform } = await import('three/tsl');
    const { createGroundAtlas } = await import('/apps/golf/src/engine/atlas.js');
    const { createV2GroundMaterialDecorator } = await import('/apps/golf/src/engine/material.js');
    const { SURFACE } = await import('/apps/golf/src/engine/surface.js');
    const { createPackedGroundDetailTexture } = await import('/apps/golf/src/engine/ground-detail-upload.mjs');
    const square = (x0, z0, x1, z1) => [[x0, z0], [x1, z0], [x1, z1], [x0, z1]];
    const C = { rough: [0.10, 0.20, 0.05], forest: [0.08, 0.15, 0.05], heath: [0.2, 0.2, 0.1], semi: [0.15, 0.30, 0.08],
      fair: [0.18, 0.36, 0.09], fringe: [0.16, 0.33, 0.08], green: [0.14, 0.38, 0.10], tee: [0.16, 0.34, 0.09],
      sand: [0.8, 0.75, 0.6], path: [0.5, 0.5, 0.5], aspL: [0.3, 0.3, 0.3], hard: [0.45, 0.42, 0.38], soil: [0.3, 0.25, 0.2],
      wet: [0.2, 0.25, 0.15], rock: [0.4, 0.4, 0.4], shore: [0.5, 0.45, 0.35] };
    const SHADE = Array.from({ length: 32 }, () => [1.5, 0.4, 0.3, 0.6]);
    const atlas = createGroundAtlas({ CORE: { x0: -40, z0: -40, x1: 40, z1: 40 },
      features: [{ surface: SURFACE.FAIRWAY, rings: [square(-30, -30, 30, 30)] }, { surface: SURFACE.GREEN, rings: [square(-8, -8, 8, 8)] }], res: 1 });
    const DETAIL = createPackedGroundDetailTexture({ seamless: true });
    const light = new THREE.DirectionalLight(0xffffff, 2.5);
    light.position.set(20, 40, 10);
    const uSun = uniform(light.position.clone().normalize());
    const draw = async (objects, eye, look) => {
      const test = new THREE.Scene();
      test.background = new THREE.Color(0xff00ff);
      test.add(new THREE.HemisphereLight(0xffffff, 0x445544, 1.2), light, ...objects);
      const view = new THREE.PerspectiveCamera(40, W / H, 0.1, 500);
      view.position.set(...eye); view.lookAt(...look);
      await renderer.compileAsync(test, view);
      renderer.setRenderTarget(target);
      renderer.render(test, view);
      renderer.setRenderTarget(null);
      const bytes = new Uint8Array(await renderer.readRenderTargetPixelsAsync(target, 0, 0, W, H));
      test.remove(...objects);
      return bytes;
    };
    const out = { ground: {}, stumps: {} };
    for (const mowFade of ['across', 'iso']) {
      const decorate = createV2GroundMaterialDecorator({ atlas, DETAIL, C, SHADE, uSun, cutTone: 1, mowStrength: 1, mowFade });
      const plane = new THREE.Mesh(new THREE.PlaneGeometry(80, 80).rotateX(-Math.PI / 2), decorate(new THREE.MeshStandardNodeMaterial()));
      const bytes = await draw([plane], [0, 60, 40], [0, 0, 0]);
      let magenta = 0;
      for (let i = 0; i < bytes.length; i += 4) if (bytes[i] > 200 && bytes[i + 1] < 60 && bytes[i + 2] > 200) magenta++;
      out.ground[mowFade] = { drawn: 1 - magenta / (W * H) };
    }
    for (const height of ['geometry', 'local']) {
      const y = height === 'geometry' ? positionGeometry.y : positionLocal.y;
      const mat = new THREE.MeshBasicNodeMaterial();
      /* dark bark, and the pale cut face on its top 7 cm (main.js stumpMat) */
      mat.colorNode = mix(color(0x3a2616), color(0xf0e0b0), smoothstep(0.3, 0.37, y));
      /* the tree sway's use of the same height, which must compile in the vertex stage too */
      mat.positionNode = positionLocal.add(vec3(sin(time).mul(y.div(13)).mul(0.001), 0, 0));
      for (const ground of [0, 50]) {
        const stump = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.16, 0.2, 0.38, 6).translate(0, 0.19, 0), mat, 1);
        stump.setMatrixAt(0, new THREE.Matrix4().makeTranslation(0, ground, 0));
        const bytes = await draw([stump], [0, ground + 0.25, 1.2], [0, ground + 0.19, 0]);
        let pale = 0, bark = 0;
        for (let i = 0; i < bytes.length; i += 4) {
          if (bytes[i] > 200 && bytes[i + 1] < 60 && bytes[i + 2] > 200) continue;
          if (bytes[i] > 150 && bytes[i + 1] > 130) pale++; else bark++;
        }
        out.stumps[`${height}-${ground}`] = { pale, bark, paleShare: pale / Math.max(1, pale + bark) };
      }
    }
    return out;
  };
  window.__result = { backend, W, H, ready: true };
} catch (error) {
  window.__result = { backend, error: String(error && error.stack || error) };
}
</script>
</body>
