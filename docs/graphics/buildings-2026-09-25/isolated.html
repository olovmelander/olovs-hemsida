  const readColour = async (scene, camera) => {

  };
  /* where each pixel is (2 km up the scale: the output clamps a negative), and what it shows */
  const OFFSET = 2000;

  /* seeThrough: glass and other see-through surfaces left out, so a pixel is labelled by what shows through them */
  const readWith = async (scene, camera, override, { seeThrough = false } = {}) => {
    const saved = [], hidden = [];

    scene.background = null;

  };
  const readPositions = (scene, camera) => readWith(scene, camera, () => positionMaterial);
  /* each pixel's height over the ground stamped under it (what the foot reads), its |normal.y|, and whether it has one */

  const MODELS = {
    angso: '/apps/golf/public/models/angso/facilities-03ec1d92965315bef789d2fab2a3ab33f7d8c4d48c4be2a81830139860cc1ce6.glb',
    johannesberg: '/apps/golf/public/models/johannesberg/facilities-ec6112a80362db78051bc7fd05056f710e09f77d6d66c0f69cdca149409f21bf.glb',
    lidingo: '/apps/golf/public/models/lidingo/facilities-2cfb8d8bb367df7a92efb51d06c3f99fe71e02661916bb752eb34c3d7cfcd39a.glb',
    puttom: '/apps/golf/public/models/puttom/facilities-v1.glb',
    ribbingsfors: '/apps/golf/public/models/ribbingsfors/facilities-2d81e0123d467f7d15753649b89d3922ae044652d3a6659649b08ebb3bd8dc39.glb',
    veckefjarden: '/apps/golf/public/models/veckefjarden/facilities-v1.glb',
    'veckefjarden church': '/apps/golf/public/models/veckefjarden/sjalevads-kyrka-v1.glb',
    'veckefjarden ski jump': '/apps/golf/public/models/veckefjarden/paradiskullen-k90-v1.glb',
    visby: '/apps/golf/public/models/visby/facilities-v1.glb',
    tortuna: '/apps/golf/public/courses/tortuna/architecture/1a78f59daa18e4474c8e0c5856d10a94acae7de36f7ffb9c75556fe1fb6b92b0.glb',

  const modelView = (model, d, view, close = false) => {

      const az = Math.atan2(d.x, d.z) + { sun: Math.PI, side: Math.PI / 2, away: 0 }[view];

    const radius = Math.max(model.size.x, model.size.z) * (close ? 0.55 : 0.8) + (close ? 8 : 12);
    const az = Math.atan2(d.x, d.z) + { sun: Math.PI, side: Math.PI / 2, away: 0 }[view];
    const cam = new THREE.PerspectiveCamera(50, W / H, 0.3, 20000);

    model.scene.add(foot ? model.footed : model.root);
    for (const m of model.materials) m.color.copy(m.userData.madeWith).multiplyScalar(albedo);
    const { p, d } = light(preset, model.scene, model, model.sky, model.centre);
    return { p, model, scene: model.scene, camera: modelView(model, d, view, close) };
  };
  window.__model = async options => {
    const v = await setModel(options);
    const colour = await readColour(v.scene, v.camera);
    for (const m of v.model.materials) m.color.copy(m.userData.madeWith);
    /* the footed model's own heights over its stamped ground, whichever version is drawn */
    v.model.scene.remove(v.model.root); v.model.scene.add(v.model.footed);
    const above = await readAbove(v.scene, v.camera);
    /* and, where a model has glass, what shows through it */
    const glass = v.model.materials.some(m => m.transparent);
    const behind = glass ? await readAbove(v.scene, v.camera, { seeThrough: true }) : null;
    const layers = glass ? await readLayers(v.scene, v.camera, BUILDING_PAINT.foot.model) : null;
    v.model.scene.remove(v.model.footed); v.model.scene.add(options.foot === false ? v.model.root : v.model.footed);
    /* the material under each pixel, by its index in the model's own list */
    const ids = await readWith(v.scene, v.camera, o => o !== v.model.ground ? idOf([o.material].flat()[0].userData.sourceIndex ?? -1) : idOf(-1));
    return { colour: b64(colour.pixels), renders: colour.renders, settled: colour.settled, above: b64(above),
      behind: behind && b64(behind), layers: layers && b64(layers), ids: b64(ids), offset: OFFSET, groundY: v.model.groundY,
      threshold: glowThresholdOf(v.p), materials: v.model.materials.map(m => ({ name: m.name, metalness: m.metalness, roughness: m.roughness,
        colour: '#' + m.color.getHexString(), transparent: m.transparent, opacity: m.opacity })), report: v.model.report };
  };

  /* ---------------------------------------------------------------- a map's alpha
     no model brings a map today; should one, only its colour takes the foot. A half-see-through grey
     panel from a map (alpha 0.5), standing on the ground in front of white, unlit: over white its pixel
     is (grey x foot) x alpha + (1 - alpha), which only a kept alpha gives */
  window.__alpha = async () => {
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(1, 1, 1);
    const map = new THREE.DataTexture(new Uint8Array([128, 128, 128, 128]), 1, 1);
    map.needsUpdate = true;
    const panel = new THREE.PlaneGeometry(4, 2, 1, 8).translate(0, 1, 0);
    stampGround(panel, () => 0);
    const camera = new THREE.PerspectiveCamera(40, W / H, 0.1, 100);
    camera.position.set(0, 1, 6); camera.lookAt(0, 1, 0);
    const rows = {};
    for (const foot of [false, true]) {
      const m = new THREE.MeshBasicNodeMaterial({ map, transparent: true, side: THREE.DoubleSide });
      if (foot) m.colorNode = wallFootColour(BUILDING_PAINT.foot.model);
      const mesh = new THREE.Mesh(panel, m);
      scene.add(mesh);
      const r = await readColour(scene, camera);
      const positions = await readPositions(scene, camera);
      scene.remove(mesh);
      /* the panel's pixels by their height, across its middle */
      const at = [];
      for (let y = 0; y < H; y++) {
        const k = (y * W + (W >> 1)) * 4;
        if (positions[k + 3] === 0) continue;
        at.push({ height: positions[k + 1] - OFFSET, value: r.pixels[k] });
      }
      rows[foot ? 'foot' : 'before'] = { settled: r.settled, at };
    }
    return { texel: 128 / 255, shade: BUILDING_PAINT.foot.model, rows };
  };

  /* how much of each building's walls stands in the foot's band over the ground it was given here */
  window.__footArea = async key => footArea((await loadModel(key)).footed, { metres: BUILDING_PAINT.foot.model.metres });

  /* ---------------------------------------------------------------- pictures, through the app's own pipeline */
  window.__picture = async ({ kind, ...options }) => {
    const v = kind === 'village' ? setVillage(options) : await setModel(options);
    const post = new THREE.RenderPipeline(renderer);
    const sceneColor = pass(v.scene, v.camera).getTextureNode('output');
    /* glowBefore: the one 0.86 of every light before the glow batch */
    const glow = bloom(sceneColor, v.p.bloom ?? 0.14, GLOW.radius, options.glowBefore ? GLOW.threshold : glowThresholdOf(v.p));
    glow.smoothWidth.value = GLOW.knee;
    post.outputNode = sceneColor.add(glow);
    for (let i = 0; i < 3; i++) { post.render(); await frame(); }
    post.dispose();
    return true;
  };

  window.__result = { backend, W, H, ready: true, models: Object.keys(MODELS) };
} catch (error) {
  window.__result = { backend, error: String(error && error.stack || error) };
}
</script>
</body>
