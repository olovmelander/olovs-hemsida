<!doctype html>

<title>The clouds batch: isolated study</title>
<!-- An island course lit as the player lights it -- the painted sky, the sun with
     its sky-lit shadows and the clouds' shade, the sky's hemisphere light and the
     preset's environment, the haze -- with the player's ground finish, the
     approved trees' impostors in stands, a fairway and a green, a lake and the
     open sea round the island in the player's water shading. Three versions are
     drawn in the same page over the same trees, atlas and textures, one at a time,
     each with its own sky, sun, impostors and water materials:
     - main: main's atmospheric sky, painted sky, cloud shadows and water shading,
       generated from git by check-isolated.mjs beside this page;
     - before: this code with both switches off (?cloudlight=0&cloudstretch=0);
     - now: the clouds lit by the sun, and their shadows drawn out along a low
       sun's light, the water's body taking them at every angle.
     `water: 'roadcut'` draws now's water with the clouds also cutting a low sun's
     road: tried and dropped (a copy of water-road.mjs with its rule opened).
     Served from the repository root by check-isolated.mjs. -->
<script type="importmap">
{ "imports": {
  "three": "/apps/golf/node_modules/three/build/three.webgpu.js",
  "three/webgpu": "/apps/golf/node_modules/three/build/three.webgpu.js",
  "three/tsl": "/apps/golf/node_modules/three/build/three.tsl.js",
  "three/addons/": "/apps/golf/node_modules/three/examples/jsm/"
} }
</script>
<body style="margin:0;background:#000">
<script type="module">
if (globalThis.GPUTexture) {
  const createView = GPUTexture.prototype.createView;
  GPUTexture.prototype.createView = function (d) { if (d && d.swizzle === 'rgba') { d = { ...d }; delete d.swizzle; } return createView.call(this, d); };
}
/* the renderer's clock, pinned: three's node frame adds the time since its last update */
const realNow = performance.now.bind(performance);
let pinnedNow = null;
performance.now = () => pinnedNow ?? realNow();

const THREE = await import('three/webgpu');
const { uniform, color, float, vec3, positionWorld, mix, smoothstep, abs, sin, fract, step, pass } = await import('three/tsl');
const SKY = await import('/apps/golf/src/engine/atmospheric-sky.mjs');
const { ATMOSPHERE_PRESETS } = await import('/apps/golf/src/engine/atmosphere-presets.mjs');
const { paintedAtmosphere, PAINTED_GROUND } = await import('/apps/golf/src/engine/painted-world-palette.mjs');
const { fetchGlb, loadFoliageAtlas, fitFoliageTier } = await import('/apps/golf/src/engine/ghibli-tree-assets.mjs');
const { setFoliageLighting } = await import('/apps/golf/src/engine/ghibli-foliage-material.mjs');
const { bakeCrownDepth } = await import('/apps/golf/src/engine/crown-depth.mjs');
const { bakeImpostorAtlas, createImpostorMaterial, createImpostorGeometry } = await import('/apps/golf/src/engine/tree-impostor.mjs');
const { createShadowTint, shadowTintFor, sunUnderClouds } = await import('/apps/golf/src/engine/shadow-tint.mjs');
const CLOUDS = await import('/apps/golf/src/engine/cloud-shadow.mjs');
const { createAerialPerspective } = await import('/apps/golf/src/engine/aerial-perspective.mjs');
const { treeTint } = await import('/apps/golf/src/engine/stand-tint.mjs');
const { hash2 } = await import('/apps/golf/src/engine/geom.js');
const { paintedGround } = await import('/apps/golf/src/engine/material.js');
const WATER = await import('/apps/golf/src/engine/water-shading.mjs');
const nordic = await import('/apps/golf/src/engine/nordic-water.mjs');
const { fillWaterNormalPixels } = await import('/apps/golf/src/engine/water-normal-texture.mjs');
const { createPackedGroundDetailTexture } = await import('/apps/golf/src/engine/ground-detail-upload.mjs');
const { createWaterReflectionLighting } = await import('/apps/golf/src/engine/water-lighting.mjs');
const { setPaintedWorldLighting, paintedWaterLight } = await import('/apps/golf/src/engine/painted-world-lighting.mjs');
const { installOutputDither } = await import('/apps/golf/src/engine/output-dither.mjs');
const ROAD = await import('/apps/golf/src/engine/water-road.mjs');
const ABOVE = await import('/apps/golf/src/engine/water-above.mjs');
const { createLightingEnvironment } = await import('/apps/golf/src/engine/lighting-environment.mjs');
const { GLOW, glowThresholdOf } = await import('/apps/golf/src/engine/glow.mjs');
const { bloom } = await import('three/addons/tsl/display/BloomNode.js');

const params = new URLSearchParams(location.search);
const backend = params.get('backend') || 'webgl2';
const W = +(params.get('w') || 640), H = +(params.get('h') || 400);
const frame = () => new Promise(r => requestAnimationFrame(r));
const painted = name => paintedAtmosphere(name, ATMOSPHERE_PRESETS[name]);
/* main's own sky and cloud shadows, when check-isolated.mjs has generated them here from git */
const MAIN = await Promise.all([import('./main-atmospheric-sky.gen.mjs'), import('./main-cloud-shadow.gen.mjs'),
  import('./main-water-shading.gen.mjs'), import('./main-water-above.gen.mjs'), import('./main-water-road.gen.mjs')])
  .then(([sky, clouds, water, above, road]) => ({ sky, clouds, water, above, road })).catch(() => null);
const b64 = a => { const u = new Uint8Array(a.buffer, a.byteOffset, a.byteLength); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };

try {
  const renderer = new THREE.WebGPURenderer({ antialias: true, samples: 4, outputBufferType: THREE.HalfFloatType,
    forceWebGL: backend === 'webgl2', reversedDepthBuffer: backend === 'webgpu' });
  renderer.setPixelRatio(1);
  renderer.setSize(W, H);
  renderer.shadowMap.enabled = true;
  installOutputDither(renderer);
  document.body.appendChild(renderer.domElement);
  await renderer.init();

  /* ------------------------------------------------------------ the light, as main.js sets it, in three versions */
  const scene = new THREE.Scene();
  const fog = new THREE.FogExp2(0xa2bcca, 0.00042);
  scene.fog = fog;
  const aerial = createAerialPerspective(fog, { sunward: true, valleyMist: true });
  scene.fogNode = aerial.node;
  const hemi = new THREE.HemisphereLight(0xffffff, 0x444444, 1);
  const environment = createLightingEnvironment(renderer, scene, { enabled: true });
  const waterLighting = createWaterReflectionLighting({ enabled: true });
  const uSun = uniform(new THREE.Vector3(0, 1, 0));
  scene.add(hemi);
  const makeSun = cloud => {
    const sun = new THREE.DirectionalLight(0xffffff, 3);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    Object.assign(sun.shadow.camera, { left: -900, right: 900, top: 900, bottom: -900, near: 1, far: 4000 });
    sun.shadow.normalBias = 0.3;
    const tint = createShadowTint(sun);
    const clouded = sunUnderClouds(sun, { cloud: cloud.vertex, tint: tint.tint });
    sun.colorNode = clouded.colorNode; sun.shadow.shadowNode = clouded.shadowNode;
    scene.add(sun, sun.target);
    return { sun, tint };
  };
  const skyOptions = { reversedDepth: renderer.reversedDepthBuffer, deterministic: true, painted: true, drawLast: true };
  const VERSIONS = {
    before: { module: SKY, sky: SKY.createAtmosphericSky({ ...skyOptions, sunLit: false }), cloud: CLOUDS.createCloudShadow({ stretch: false }),
      water: WATER, long: false },
    now: { module: SKY, sky: SKY.createAtmosphericSky({ ...skyOptions, sunLit: true }), cloud: CLOUDS.createCloudShadow({ stretch: true }),
      water: WATER, long: true },
  };
  if (MAIN) VERSIONS.main = { module: MAIN.sky, sky: MAIN.sky.createAtmosphericSky(skyOptions), cloud: MAIN.clouds.createCloudShadow(),
    water: MAIN.water, long: null };
  for (const v of Object.values(VERSIONS)) { Object.assign(v, makeSun(v.cloud)); scene.add(v.sky); }

  /* ------------------------------------------------------------ the island: rough, a fairway north from the tee, a green */
  const DETAIL = createPackedGroundDetailTexture({ seamless: true });
  const fairCentre = z => sin(z.div(170)).mul(22);
  const wp = positionWorld.xz;
  const across = wp.x.sub(fairCentre(wp.y));
  const inside = (x, edge, soft) => float(1).sub(smoothstep(edge, edge + soft, x));
  const onFairway = inside(abs(across), 25, 4).mul(inside(wp.y, 335, 10)).mul(smoothstep(-345, -335, wp.y));
  const onGreen = inside(wp.sub(vec3(4, 0, -345).xz).length(), 15, 2);
  const onTee = inside(abs(wp.x.sub(fairCentre(float(372)))), 6, 1).mul(inside(abs(wp.y.sub(372)), 10, 2));
  let base = mix(color(PAINTED_GROUND.rough), color(PAINTED_GROUND.fair), onFairway);
  base = mix(base, color(PAINTED_GROUND.tee), onTee);
  base = mix(base, color(PAINTED_GROUND.green), onGreen);
  const cut = onFairway.max(onGreen).max(onTee);
  const mow = step(0.5, fract(wp.y.div(14))).mul(cut).mul(0.05);
  const groundMaterial = new THREE.MeshStandardNodeMaterial({ metalness: 0 });
  Object.assign(groundMaterial, paintedGround({ base, wp, DETAIL, uSun, mow, turf: float(1), gloss: mix(float(0.06), float(0.28), onFairway).max(onGreen.mul(0.42)) }));
  const ISLAND = 1500, LAKE = { x: -30, z: -520, r: 150 };
  /* the ground, 12 m a vertex (the clouds' shade is read per vertex); the sea covers it past the island's shore */
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(2 * (ISLAND + 60), 2 * (ISLAND + 60), 256, 256).rotateX(-Math.PI / 2), groundMaterial);
  /* under the sea and the lake the ground drops away, so a view from a kilometre up does not see it through them */
  { const pos = ground.geometry.attributes.position;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), z = pos.getZ(i);
      if (Math.hypot(x, z) > ISLAND - 12) pos.setY(i, -8);
      else if (Math.hypot(x - LAKE.x, z - LAKE.z) < LAKE.r + 6) pos.setY(i, -4);
    }
    ground.geometry.computeVertexNormals(); }
  ground.receiveShadow = true;
  scene.add(ground);

  /* a plain field 40 km across, 50 m a vertex, drawn alone in the `plane` view: the clouds' shadows over many clouds */
  const plane = new THREE.Mesh(new THREE.PlaneGeometry(40000, 40000, 800, 800).rotateX(-Math.PI / 2),
    new THREE.MeshStandardNodeMaterial({ color: 0x8a8a8a, roughness: 1, metalness: 0 }));
  plane.visible = false; plane.frustumCulled = false;
  scene.add(plane);

  /* ------------------------------------------------------------ the lake, north of the green, and the open sea round the island */
  const WATERN = (() => {
    const c = document.createElement('canvas'); c.width = c.height = 512;
    const g = c.getContext('2d'), im = g.createImageData(512, 512);
    fillWaterNormalPixels(im.data, 512, { seamless: true });
    g.putImageData(im, 0, 0);
    const t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
    return t;
  })();
  const glint = uniform(1), chop = uniform(1);
  const uLeaf = uniform(new THREE.Color(0x5f8944)), uAutumn = uniform(0);
  const waterMaterial = (v, sea, water = v.water) => {
    const m = new THREE.MeshBasicNodeMaterial({ side: THREE.DoubleSide });
    const { colour } = water.waterShading({ WATERN, DETAIL, sun: uSun, waterLighting, glint, chop, cloud: v.cloud, ocean: false, showBed: false,
      nordic: true, wind: true, road: true, mirror: true, relief: true, sea, cloudShade: true, lanes: true, ...(v.long === null ? {} : { longShadows: v.long }) });
    m.colorNode = colour.mul(paintedWaterLight);
    return m;
  };
  const lake = (() => {
    const g = new THREE.CircleGeometry(LAKE.r, 128).rotateX(-Math.PI / 2);
    const pos = g.attributes.position, n = pos.count, shore = new Float32Array(n);
    for (let i = 0; i < n; i++) shore[i] = LAKE.r - Math.hypot(pos.getX(i), pos.getZ(i));
    g.setAttribute('aShore', new THREE.Float32BufferAttribute(shore, 1));
    g.setAttribute('aFoam', new THREE.Float32BufferAttribute(new Float32Array(n).fill(1), 1));
    g.setAttribute('aDepth', new THREE.Float32BufferAttribute(Array.from(shore, s => s / 8), 1));
    const mesh = new THREE.Mesh(g);
    mesh.position.set(LAKE.x, 0.15, LAKE.z);
    return mesh;
  })();
  const sea = (() => {
    const g = new THREE.RingGeometry(ISLAND, 40000, 192, 24).rotateX(-Math.PI / 2);
    const n = g.attributes.position.count;
    for (const [name, value] of [['aShore', 60], ['aFoam', 1], ['aDepth', 3]]) g.setAttribute(name, new THREE.Float32BufferAttribute(new Float32Array(n).fill(value), 1));
    const mesh = new THREE.Mesh(g);
    mesh.position.y = 0.15; mesh.frustumCulled = false;
    return mesh;
  })();
  for (const v of Object.values(VERSIONS)) { v.lake = waterMaterial(v, false); v.sea = waterMaterial(v, true); }
  scene.add(lake, sea);
  /* tried and dropped: the clouds cutting a low sun's road too -- now's water from copies of its shading and of the
     water from above importing a copy of water-road.mjs whose rule lets the clouds cut the road at every sun */
  const copyModule = async (path, replacements) => {
    let src = await (await fetch(path)).text();
    src = src.replaceAll("from './", `from '${location.origin}/apps/golf/src/engine/`);
    for (const [a, b] of replacements) { if (!src.includes(a)) throw new Error(`copy of ${path}: ${a}`); src = src.replaceAll(a, b); }
    return URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
  };
  const E = `${location.origin}/apps/golf/src/engine/`;
  const roadOpen = await copyModule(E + 'water-road.mjs', [['cloudSun: [Math.sin(15 * Math.PI / 180), Math.sin(35 * Math.PI / 180)]', 'cloudSun: [-1.1, -1]']]);
  const aboveOpen = await copyModule(E + 'water-above.mjs', [[`from '${E}water-road.mjs'`, `from '${roadOpen}'`]]);
  const shadingOpen = await copyModule(E + 'water-shading.mjs', [[`from '${E}water-above.mjs'`, `from '${aboveOpen}'`], [`from '${E}water-road.mjs'`, `from '${roadOpen}'`]]);
  const ROADCUT = { shading: await import(shadingOpen), modules: [await import(aboveOpen), await import(roadOpen)] };
  VERSIONS.now.lakeRoadcut = waterMaterial(VERSIONS.now, false, ROADCUT.shading);
  VERSIONS.now.seaRoadcut = waterMaterial(VERSIONS.now, true, ROADCUT.shading);
  /* every copy of the water's modules takes the preset: each keeps its own uniforms */
  const WATER_MODULES = [ROAD, ABOVE, ...ROADCUT.modules, ...(MAIN ? [MAIN.road, MAIN.above] : [])];

  /* ------------------------------------------------------------ the woods: pine, spruce and birch impostors in stands */
  const treeBase = '/apps/golf/public/models/trees/';
  const manifest = await (await fetch(treeBase + 'ghibli-fluffy.json')).json();
  const SPECIES = [['tall', 0x2c5230], ['gran', 0x3a6134], ['björk', 0x5f8944]];
  const kinds = [];
  for (const [key, cc] of SPECIES) {
    const entry = manifest.species.find(e => e.key === key);
    const variant = entry.variants[0], rec = variant.tiers.full;
    const map = await loadFoliageAtlas(treeBase, entry.foliage.atlas, fetch);
    const tree = await fetchGlb(treeBase + rec.file, rec, fetch);
    fitFoliageTier(tree, variant.templateHeight, variant.templateRadius);
    bakeCrownDepth(tree.crown);
    const atlas = bakeImpostorAtlas(renderer, { crown: tree.crown, trunk: tree.trunk, trunkColor: new THREE.Color(...tree.trunkMean),
      foliage: { key: entry.foliage.key, map } });
    kinds.push({ key, cc, atlas, height: variant.templateHeight });
  }
  const spots = [[], [], []];
  for (let x = -1300; x <= 1300; x += 11) for (let z = -1300; z <= 1300; z += 11) {
    const px = x + (hash2(x * 3 + 1, z * 5 + 2) - 0.5) * 8, pz = z + (hash2(z * 7 + 3, x * 11 + 4) - 0.5) * 8;
    if (Math.hypot(px, pz) > ISLAND - 90) continue;                                             /* the island's shore */
    const off = Math.abs(px - Math.sin(pz / 170) * 22);
    if (pz > -360 && pz < 420 && off < 48 + 14 * hash2(px * 0.02, pz * 0.02)) continue;          /* the hole's corridor */
    if (Math.hypot(px - LAKE.x, pz - LAKE.z) < LAKE.r + 18) continue;                         /* the lake and its shore */
    if (Math.hypot(px - 4, pz + 345) < 40) continue;                                            /* round the green */
    if (hash2(px * 0.011, pz * 0.011) > 0.62) continue;                                         /* glades */
    const r = hash2(px * 0.004 + 3.1, pz * 0.004 - 1.7);
    spots[r < 0.45 ? 0 : r < 0.8 ? 1 : 2].push([px, pz]);
  }
  kinds.forEach((kind, s) => {
    const list = spots[s];
    const geometry = createImpostorGeometry(list.length);
    const P = geometry.getAttribute('aImpostorPos').array, Q = geometry.getAttribute('aImpostorParam').array, T = geometry.getAttribute('aTint').array;
    list.forEach(([x, z], i) => { P.set([x, 0, z], i * 3); const sc = 0.85 + hash2(x, z) * 0.35; Q.set([hash2(z, x) * 6.28, sc, sc, 0], i * 4); treeTint(x, z, T, i * 4); });
    geometry.instanceCount = list.length;
    for (const v of Object.values(VERSIONS)) {
      const mesh = new THREE.Mesh(geometry, createImpostorMaterial(kind.atlas, { crownBase: kind.key === 'björk' ? mix(uLeaf, uLeaf.mul(0.7), uAutumn) : color(kind.cc),
        sunDirection: uSun, sunlit: v.cloud.vertex, autumn: uAutumn }));
      mesh.frustumCulled = false; mesh.castShadow = true;
      scene.add(mesh);
      (v.trees ??= []).push(mesh);
    }
  });

  /* ------------------------------------------------------------ the views */
  const VIEWS = {
    tee: { at: [4, 6, 385], look: [12, 3, -150], fov: 50 },
    flyover: { at: [-330, 95, 520], look: [0, 0, -200], fov: 50 },
    lake: { at: [95, 5, -640], look: [-260, 0, -300], fov: 50 },
    /* straight down from 1.6 and 3.4 km, north up: the clouds' shadows over the island */
    above: { at: [0, 1600, 0], down: true, fov: 60 },
    high: { at: [0, 3400, 0], down: true, fov: 60 },
    /* the plain field alone from 8 km up, north up: 9 by 15 km of the clouds' shadows */
    plane: { at: [0, 8000, 0], down: true, fov: 60, plane: true },
    /* the sky alone, from 200 m up, 12 degrees above the horizon: toward the sun's azimuth, across it and away; and straight up */
    towardSky: { at: [0, 200, 0], pitch: 12, fov: 75, azimuth: 0, sky: true },
    sideSky: { at: [0, 200, 0], pitch: 12, fov: 75, azimuth: Math.PI / 2, sky: true },
    awaySky: { at: [0, 200, 0], pitch: 12, fov: 75, azimuth: Math.PI, sky: true },
    zenith: { at: [0, 200, 0], up: true, fov: 80, sky: true },
    /* closer: a few clouds 20 degrees up, toward the sun, across its light and away */
    cloudsToward: { at: [0, 200, 0], pitch: 20, fov: 40, azimuth: 0.35, sky: true },
    cloudsSide: { at: [0, 200, 0], pitch: 20, fov: 40, azimuth: Math.PI / 2, sky: true },
    cloudsAway: { at: [0, 200, 0], pitch: 20, fov: 40, azimuth: Math.PI, sky: true },
    /* the land from 45 m over the woods, a little down: toward the sun, across its light and away */
    toward: { at: [0, 45, 60], pitch: -5, fov: 60, azimuth: 0 },
    across: { at: [0, 45, 60], pitch: -5, fov: 60, azimuth: Math.PI / 2 },
    away: { at: [0, 45, 60], pitch: -5, fov: 60, azimuth: Math.PI },
    /* the sea from the island's shore at a player's heights: toward the sun (its road), across it and away */
    seaToward: { shore: 0, height: 30, pitch: -4, fov: 55 },
    seaAcross: { shore: Math.PI / 2, height: 30, pitch: -4, fov: 55 },
    seaAway: { shore: Math.PI, height: 30, pitch: -4, fov: 55 },
    seaHigh: { shore: 0, height: 180, pitch: -12, fov: 50 },
  };
  const camera = (name, aspect, p) => {
    const v = VIEWS[name], cam = new THREE.PerspectiveCamera(v.fov, aspect, v.down ? 20 : 0.5, 40000);
    const d = new THREE.Vector3(...p.dir).normalize(), sunAz = Math.atan2(d.x, d.z);
    if (v.shore !== undefined) {
      /* on the shore in that direction from the sun's azimuth, looking out over the sea */
      const az = sunAz + v.shore, ax = Math.sin(az), az_ = Math.cos(az), r = ISLAND - 40, t = Math.tan(v.pitch * Math.PI / 180);
      cam.position.set(ax * r, v.height, az_ * r);
      cam.lookAt(ax * (r + 1), v.height + t, az_ * (r + 1));
      return cam;
    }
    cam.position.set(...v.at);
    if (v.down) { cam.up.set(0, 0, -1); cam.lookAt(v.at[0], 0, v.at[2]); }
    else if (v.up) { cam.up.set(0, 0, -1); cam.lookAt(v.at[0], v.at[1] + 1, v.at[2]); }
    else if (v.azimuth !== undefined) {
      const az = sunAz + v.azimuth, t = Math.tan(v.pitch * Math.PI / 180);
      cam.lookAt(v.at[0] + Math.sin(az), v.at[1] + t, v.at[2] + Math.cos(az));
    } else cam.lookAt(...v.look);
    return cam;
  };

  /* ------------------------------------------------------------ one light, in one version */
  const setLight = (name, over = {}, { cloudOffset = [900, 300], version = 'now', view = 'tee', stretch = null, hide = [], water = null } = {}) => {
    const v = VERSIONS[version];
    if (!v) throw new Error(`no version ${version}`);
    const p = { ...painted(name), ...over }, skyP = { ...p, skyCloudGlow: p.skyCloudGlow ?? 0 };
    const skyView = !!VIEWS[view].sky;
    for (const [key, u] of Object.entries(VERSIONS)) {
      const on = key === version;
      u.sky.visible = on; u.sun.visible = on;
      u.trees.forEach(t => { t.visible = on && !skyView && !hide.includes('trees'); });
    }
    const planeView = !!VIEWS[view].plane;
    ground.visible = lake.visible = sea.visible = !skyView && !planeView;
    plane.visible = planeView;
    if (planeView) for (const u of Object.values(VERSIONS)) u.trees.forEach(t => { t.visible = false; });
    if (water && !(version === 'now' && water === 'roadcut')) throw new Error(`no water ${water} in ${version}`);
    lake.material = water ? v.lakeRoadcut : v.lake; sea.material = water ? v.seaRoadcut : v.sea;
    const d = new THREE.Vector3(...p.dir).normalize();
    uSun.value.copy(d);
    setPaintedWorldLighting(p, name);
    setFoliageLighting(p);
    waterLighting.setPreset(p);
    environment.setPreset(JSON.stringify([p.environment, p.environmentIntensity]), p);
    const { sun, tint, cloud } = v;
    sun.color.setHex(p.sun); sun.intensity = p.int;
    sun.target.position.set(0, 0, 0); sun.position.copy(d).multiplyScalar(2000);
    shadowTintFor(p, tint.tint.value);
    cloud.setPreset(p); cloud.setSun(d); cloud.setOffset(...cloudOffset);
    if (stretch !== null && cloud.squeeze) { cloud.squeeze.value = 1 / stretch - 1; cloud.setOffset(...cloudOffset); }
    uLeaf.value.setHex(p.leaf ?? 0x5f8944); uAutumn.value = name === 'host' ? 1 : 0;
    hemi.color.setHex(p.hemiS); hemi.groundColor.setHex(p.hemiG); hemi.intensity = p.hemiI * (p.paintedFill ?? 1);
    fog.color.setHex(p.fog); fog.density = p.dens;
    fog.color.lerp(new THREE.Color(p.paintedFog), 0.22); fog.density *= 0.9;
    v.module.setAtmospherePreset(v.sky, skyP); v.module.setSkyGroundHaze(v.sky, fog.color);
    aerial.setPreset(skyP);
    renderer.toneMappingExposure = p.exp;
    nordic.setNordicWaterPreset(p, { sky: skyP, fogColour: fog.color, fogDensity: fog.density, hazeMax: p.hazeMax });
    nordic.waterFlow.forEach(f => f.value.set(0, 0));
    nordic.waterPatchOffset.value.set(0, 0);
    nordic.waterChop.value = 1;
    for (const m of WATER_MODULES) { m.setWaterRoadPreset?.(p); m.setWaterAbovePreset?.(p, { environment: true }); }
    return p;
  };
  const pin = () => { const nodeFrame = renderer._nodes.nodeFrame; pinnedNow = 1e9; nodeFrame.lastTime = pinnedNow; nodeFrame.time = 1234.5; };
  const unpin = () => { pinnedNow = null; renderer._nodes.nodeFrame.lastTime = undefined; };

  /* the picture, through the app's tone mapping; `glow` adds high quality's bloom at the preset's strength and threshold */
  window.__show = async ({ preset = 'golden', view = 'tee', glow = true, over = {}, cloudOffset, version, stretch, hide, water }) => {
    const p = setLight(preset, over, { cloudOffset, version, view, stretch, hide, water }), cam = camera(view, W / H, p);
    await renderer.compileAsync(scene, cam);
    if (!glow) { for (let i = 0; i < 3; i++) { pin(); renderer.render(scene, cam); unpin(); await frame(); } return true; }
    const post = new THREE.RenderPipeline(renderer);
    const sceneColor = pass(scene, cam).getTextureNode('output');
    const b = bloom(sceneColor, p.bloom ?? 0.14, GLOW.radius, glowThresholdOf(p));
    b.smoothWidth.value = GLOW.knee;
    post.outputNode = sceneColor.add(b);
    for (let i = 0; i < 3; i++) { pin(); post.render(); unpin(); await frame(); }
    post.dispose();
    return true;
  };
  /* the linear colour before exposure and tone mapping, settled: two renders in a row agree */
  const target = new THREE.RenderTarget(W, H, { type: THREE.HalfFloatType, depthBuffer: true });
  window.__read = async ({ preset = 'golden', view = 'tee', over = {}, cloudOffset, version, stretch, hide, water }) => {
    const p = setLight(preset, over, { cloudOffset, version, view, stretch, hide, water });
    const cam = camera(view, W / H, p);
    await renderer.compileAsync(scene, cam);
    const tone = renderer.toneMapping;
    renderer.toneMapping = THREE.NoToneMapping;
    let last = null, renders = 0, settled = false;
    while (!settled && renders < 6) {
      pin();
      renderer.setRenderTarget(target); renderer.render(scene, cam); renderer.setRenderTarget(null);
      unpin();
      const now = await renderer.readRenderTargetPixelsAsync(target, 0, 0, W, H);
      renders++;
      settled = last !== null && now.every((v, k) => v === last[k]);
      last = now;
      if (!settled) await frame();
    }
    renderer.toneMapping = tone;
    return { px: b64(Float32Array.from(last, THREE.DataUtils.fromHalfFloat)), renders, settled };
  };
  window.__result = { backend, W, H, ready: true, main: !!MAIN, views: VIEWS, trees: spots.map(s => s.length) };
} catch (error) {
  window.__result = { backend, error: String(error && error.stack || error) };
}
</script>
