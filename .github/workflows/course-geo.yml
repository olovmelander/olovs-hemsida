name: course geo

on:
  pull_request:
    paths:
      - ".github/workflows/course-geo.yml"
      - ".github/workflows/course-geo-hole-controls.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/course-geo/**"
      - "packages/course-v2/**"
      - "apps/golf/src/engine/v2-*.mjs"
      - "apps/golf/src/loader/**"
      - "apps/golf/v2-terrain-proof.html"
      - "apps/golf/vite.config.js"
      - "geo_data/course-v2/**"
      - "**build/course-model.json"
      - "upsalabuild/mellanbanan-model.json"
  push:
    branches: [main, codex/terrain-v2-runtime-integration]
    paths:
      - ".github/workflows/course-geo.yml"
      - ".github/workflows/course-geo-hole-controls.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "packages/course-geo/**"
      - "packages/course-v2/**"
      - "apps/golf/src/engine/v2-*.mjs"
      - "apps/golf/src/loader/**"
      - "apps/golf/v2-terrain-proof.html"
      - "apps/golf/vite.config.js"
      - "geo_data/course-v2/**"
      - "**build/course-model.json"
      - "upsalabuild/mellanbanan-model.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked schema-test dependencies
        run: pnpm install --frozen-lockfile

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          working-directory: packages/course-geo/toolchain
          frozen: true
          cache: true

      - name: Verify source manifests
        run: node packages/course-geo/check-manifests.mjs

      - name: Test coordinate and datum controls
        run: pixi run --frozen test-controls
        working-directory: packages/course-geo/toolchain

      - name: Test shared geospatial modules
        run: |
          node --test \
            packages/course-geo/frame.node-test.mjs \
            packages/course-geo/manifest.node-test.mjs \
            packages/course-geo/migration.node-test.mjs
          pixi run --manifest-path packages/course-geo/toolchain/pixi.toml --frozen test-acquisition

      - name: Verify every-course per-hole source controls
        run: pixi run --manifest-path packages/course-geo/toolchain/pixi.toml --frozen plan-hole-controls

      - name: Test v2 asset graph and codecs
        run: >-
          node --test
          packages/course-v2/course-v2.node-test.mjs
          packages/course-v2/authoritative-surface-source.node-test.mjs
          packages/course-v2/capture-proof-policy.node-test.mjs
          packages/course-v2/surface-object-contract.node-test.mjs
          packages/course-v2/surface-preview.node-test.mjs
          packages/course-v2/terrain-pyramid.node-test.mjs
          packages/course-v2/terrain-compiler.node-test.mjs
          packages/course-v2/terrain-preview-release.node-test.mjs
          packages/course-v2/visual-evidence.node-test.mjs
          packages/course-v2/runtime/runtime.node-test.mjs
          packages/course-v2/runtime/terrain-grid-topology.node-test.mjs
          packages/course-v2/runtime/terrain-render-data.node-test.mjs
          packages/course-v2/runtime/terrain-tile-manager.node-test.mjs
          packages/course-v2/runtime/terrain-stream-controller.node-test.mjs

      - name: Verify synthetic v2 graph
        run: node packages/course-v2/check-synthetic.mjs

      - name: Test player v1 fallback and isolated v2 runtime
        run: pnpm exec vitest run

      - name: Build isolated Three r185 renderer proof
        run: node packages/course-v2/check-renderer-build.mjs

      - name: Build player with isolated v2 debug chunk
        run: pnpm --filter @banvy/golf build && node packages/course-v2/check-app-build.mjs

      - name: Verify generated migration artifacts
        run: pixi run --frozen check-migration
        working-directory: packages/course-geo/toolchain

      - name: Verify D2 source-discovery evidence
        run: node packages/course-geo/acquisition/check-discovery.mjs
