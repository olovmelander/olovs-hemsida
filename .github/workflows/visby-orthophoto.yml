name: Visby authenticated orthophoto

on:
  workflow_dispatch:
  push:
    branches:
      - codex/visby-lantmateriet-alignment
    paths:
      - '.github/workflows/visby-orthophoto.yml'
      - 'visbybuild/mapping/lm-ortho-plan.mjs'
      - 'visbybuild/mapping/lm_ortho.py'
      - 'geo_data/course-v2/visby/acquisition/RUN-orthophoto'

permissions:
  contents: read

concurrency:
  group: visby-orthophoto-${{ github.ref }}
  cancel-in-progress: false

jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check review grid and bounded access handling
        run: |
          node --test visbybuild/mapping/lm-ortho-plan.node-test.mjs
          python -m unittest discover -s visbybuild/mapping -p test_lm_ortho.py
      - name: Plan all tee and priority surface windows
        run: node visbybuild/mapping/lm-ortho-plan.mjs
      - name: Verify actual orthophoto bytes
        env:
          LANTMATERIET_USERNAME: ${{ secrets.LANTMATERIET_USERNAME }}
          LANTMATERIET_PASSWORD: ${{ secrets.LANTMATERIET_PASSWORD }}
          LANTMATERIET_BEARER_TOKEN: ${{ secrets.LANTMATERIET_BEARER_TOKEN }}
        run: python visbybuild/mapping/lm_ortho.py --plan visbybuild/cache/lm-ortho/plan.json --probe-only
      - name: Install the bounded raster reader
        run: python -m pip install rasterio==1.4.3 numpy==2.3.5
      - name: Read georeferenced RGBI windows
        env:
          LANTMATERIET_USERNAME: ${{ secrets.LANTMATERIET_USERNAME }}
          LANTMATERIET_PASSWORD: ${{ secrets.LANTMATERIET_PASSWORD }}
          LANTMATERIET_BEARER_TOKEN: ${{ secrets.LANTMATERIET_BEARER_TOKEN }}
        run: python visbybuild/mapping/lm_ortho.py --plan visbybuild/cache/lm-ortho/plan.json
      - name: Retain access evidence and metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visby-orthophoto-evidence-${{ github.run_number }}
          path: |
            visbybuild/cache/lm-ortho/plan.json
            visbybuild/cache/lm-ortho/acquisition.json
          if-no-files-found: error
          retention-days: 14
      - name: Remove raw image windows
        if: always()
        run: rm -rf visbybuild/cache/lm-ortho
