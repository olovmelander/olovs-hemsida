name: ground vegetation

# The Lantmäteriet credentials live as repository secrets, so the credentialed
# LiDAR reads run here, where the secrets are — the same pattern as
# course-geo-access.yml. Any ground with a pinned campaign inventory can run;
# the ground comes from the RUN file's own path (or the dispatch input).
# Two modes, one deterministic chain:
#
#   acquire (default): preflight → campaign re-check → COPC census →
#     canopy rasters → machine-reviewed compile → review overlays. Commits the
#     evidence and the overlays back to the branch so the overhead can be
#     EYEBALLED before anything publishes (the six-trees-on-the-range lesson).
#   publish: repeats the same chain with the same --observed-on (byte-stable
#     evidence), then publishes the generation for EVERY course of the ground
#     and runs the cheap gates before committing the chunks and manifests.
on:
  workflow_dispatch:
    inputs:
      ground:
        description: "Ground id (geo_data/course-v2/<ground>)"
        default: "veckefjarden"
        required: true
      publish:
        description: "Publish the compiled generation (only after eyeballing the review overlays from an acquire run)"
        type: boolean
        default: false
      observed_on:
        description: "Evidence date YYYY-MM-DD; keep identical between the acquire and publish runs"
        required: true
  # A push to a ground's RUN control file starts a run with the parameters it
  # carries — the trigger for callers holding contents:write but not
  # actions:write (the remote session's GitHub App). The workflow's own
  # evidence commit does not touch RUN and pushes with GITHUB_TOKEN, so it can
  # never retrigger itself.
  push:
    branches:
      - "claude/**"
    paths:
      - "geo_data/course-v2/*/vegetation/RUN"

permissions:
  contents: write

concurrency:
  group: ground-vegetation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  vegetation:
    name: vegetation
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          # the pushed RUN file is found by diffing against the parent commit
          fetch-depth: 2

      - name: Resolve run parameters (dispatch inputs, or the pushed RUN control file)
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "GROUND=${{ inputs.ground }}" >> "$GITHUB_ENV"
            echo "PUBLISH=${{ inputs.publish }}" >> "$GITHUB_ENV"
            echo "OBSERVED_ON=${{ inputs.observed_on }}" >> "$GITHUB_ENV"
          else
            changed=$(git diff --name-only HEAD^ HEAD -- 'geo_data/course-v2/*/vegetation/RUN' | head -1)
            if [ -z "$changed" ]; then
              echo "the push touched no RUN control file" >&2
              exit 1
            fi
            ground=$(basename "$(dirname "$(dirname "$changed")")")
            # shellcheck disable=SC1090
            . "$changed"
            echo "GROUND=${ground}" >> "$GITHUB_ENV"
            echo "PUBLISH=${publish}" >> "$GITHUB_ENV"
            echo "OBSERVED_ON=${observed_on}" >> "$GITHUB_ENV"
          fi

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Install the COPC reader (own install, never in the workspace lockfile)
        run: npm install --prefix packages/course-geo/copc-reader

      - name: Verify repository secrets are configured
        env:
          LANTMATERIET_USERNAME: ${{ secrets.LANTMATERIET_USERNAME }}
          LANTMATERIET_PASSWORD: ${{ secrets.LANTMATERIET_PASSWORD }}
        run: |
          if [ -z "$LANTMATERIET_USERNAME" ] || [ -z "$LANTMATERIET_PASSWORD" ]; then
            echo "LANTMATERIET_USERNAME / LANTMATERIET_PASSWORD secrets are not configured" >&2
            exit 1
          fi

      - name: Lantmäteriet access preflight (exits 2 on denial)
        env:
          LANTMATERIET_USERNAME: ${{ secrets.LANTMATERIET_USERNAME }}
          LANTMATERIET_PASSWORD: ${{ secrets.LANTMATERIET_PASSWORD }}
        run: node packages/course-geo/acquisition/access-preflight.mjs --ground "$GROUND" --provider lantmateriet

      - name: Campaign inventory drift gate
        run: node packages/course-geo/acquisition/record-laser-campaigns.mjs --ground "$GROUND" --check

      - name: COPC hierarchy census (headers, no point bytes)
        env:
          LANTMATERIET_USERNAME: ${{ secrets.LANTMATERIET_USERNAME }}
          LANTMATERIET_PASSWORD: ${{ secrets.LANTMATERIET_PASSWORD }}
        run: |
          node packages/course-geo/acquisition/run-copc-census.mjs \
            --ground "$GROUND" --write --full \
            --observed-on "$OBSERVED_ON"

      - name: Build the 1 m canopy rasters (read its ground-minus-DTM line first)
        env:
          LANTMATERIET_USERNAME: ${{ secrets.LANTMATERIET_USERNAME }}
          LANTMATERIET_PASSWORD: ${{ secrets.LANTMATERIET_PASSWORD }}
        run: |
          node packages/course-geo/copc-reader/build-canopy.mjs \
            --ground "$GROUND" \
            --out "$RUNNER_TEMP/veg/rasters" \
            --observed-on "$OBSERVED_ON"

      - name: Compile the machine-reviewed generation
        run: |
          # one --raster per active campaign item that build-canopy actually
          # wrote (item id slugified). build-canopy is the authority on
          # coverage: an item can be active in the pinned inventory because it
          # intersects the AOI bbox yet reach no published finest tile
          # (Norrfällsviken's 25f014-699_67 lies wholly north of the course
          # window), and build-canopy skips it and writes no raster — so the
          # args are derived from its output, never by restating the
          # inventory. Zero rasters is still a failure. Paths under
          # RUNNER_TEMP carry no spaces, so word-splitting the list is safe.
          RASTER_ARGS=$(node --input-type=module -e "
            import fs from 'node:fs';
            const c = JSON.parse(fs.readFileSync('geo_data/course-v2/' + process.env.GROUND + '/acquisition/laser-campaigns.json', 'utf8'));
            const dir = process.env.RUNNER_TEMP + '/veg/rasters';
            let written = 0;
            for (const item of c.items) {
              if (item.role !== 'active' || item.excludedFromCanopy) continue;
              const slug = item.id.replace(/[^a-z0-9]+/gi, '-').toLowerCase();
              const f32 = dir + '/chm-' + slug + '.f32', sidecar = dir + '/chm-' + slug + '.json';
              if (!fs.existsSync(f32) || !fs.existsSync(sidecar)) {
                console.error('no raster for active item ' + item.id + ' — build-canopy skipped it (no published finest tile intersects)');
                continue;
              }
              written++;
              process.stdout.write('--raster ' + item.id + '=' + f32 + ':' + sidecar + ' ');
            }
            if (!written) { console.error('build-canopy wrote no rasters at all'); process.exit(1); }")
          echo "rasters: $RASTER_ARGS"
          node packages/course-v2/vegetation/compile-vegetation.mjs \
            --ground "$GROUND" \
            --out "$RUNNER_TEMP/veg/compile" \
            $RASTER_ARGS \
            --machine-review \
            --observed-on "$OBSERVED_ON"

      - name: Render the review overlays
        run: |
          node packages/course-v2/vegetation/render-review.mjs \
            --ground "$GROUND" \
            --rasters "$RUNNER_TEMP/veg/rasters" \
            --candidates "$RUNNER_TEMP/veg/compile/candidates.json" \
            --out "$RUNNER_TEMP/veg/review"

      - name: Keep the review overlays on the branch for the eyeball
        run: |
          mkdir -p "geo_data/course-v2/$GROUND/vegetation/review"
          cp -r "$RUNNER_TEMP/veg/review/." "geo_data/course-v2/$GROUND/vegetation/review/"

      - name: Publish the generation for every course of the ground
        if: env.PUBLISH == 'true'
        run: |
          node packages/course-v2/vegetation/publish-vegetation.mjs \
            --ground "$GROUND" \
            --compile "$RUNNER_TEMP/veg/compile" \
            --public apps/golf/public

      - name: Gates (manifests, unit tests, build, app-build graph verify)
        if: env.PUBLISH == 'true'
        run: |
          node packages/course-geo/check-manifests.mjs
          pnpm test
          pnpm --filter @banvy/golf build
          node packages/course-v2/check-app-build.mjs

      - name: Upload the compile directory and overlays
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.GROUND }}-vegetation-${{ env.PUBLISH == 'true' && 'publish' || 'acquire' }}-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/veg/compile
            ${{ runner.temp }}/veg/review
          if-no-files-found: error
          retention-days: 7

      - name: Commit the evidence (and, when publishing, the graph) to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "geo_data/course-v2/$GROUND"
          if [ "$PUBLISH" = "true" ]; then
            git add apps/golf/public
          fi
          if git diff --cached --quiet; then
            echo "nothing new to commit"
            exit 0
          fi
          git commit -m "$GROUND vegetation ${{ env.PUBLISH == 'true' && 'publish' || 'acquisition evidence' }} ($OBSERVED_ON)" \
            -m "Produced by the ground-vegetation workflow run ${{ github.run_id }} with the repository's Lantmäteriet credentials." \
            -m "Co-Authored-By: Claude Fable 5 <noreply@anthropic.com>" \
            -m "Claude-Session: https://claude.ai/code/session_015uNzTAXTzkXbGYS4eU7kS2"
          # the branch may have moved while the run was reading points (an
          # acquire takes an hour): rebase the evidence commit onto it rather
          # than lose it to a non-fast-forward rejection
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
