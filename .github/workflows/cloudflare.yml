# Deploy Banvy (static assets + API Worker + D1 migrations) to Cloudflare Workers.
#
# Once you have:
#   1. Created the D1 database (`npx wrangler d1 create banvy-db`) and updated
#      `database_id` in apps/worker/wrangler.jsonc
#   2. Added CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to GitHub Secrets
#   3. Set production secrets in Cloudflare (`BETTER_AUTH_SECRET`, `BETTER_AUTH_URL`,
#      `GOOGLE_CLIENT_ID`, `GOOGLE_CLIENT_SECRET`)
# you can trigger this manually or uncomment the `push` trigger below.
name: cloudflare

on:
  workflow_dispatch:
  # push:
  #   branches: [main]

permissions:
  contents: read

concurrency:
  group: cloudflare-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Banvy frontend for root path
        env:
          BANVY_BASE: /
        run: pnpm --filter @banvy/golf build

      - name: Verify prepared startup data matches the build
        run: node tools/check-prepared-startup.mjs --public apps/golf/dist

      - name: Apply D1 migrations
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler d1 migrations apply banvy-db --remote

      - name: Deploy Worker and Static Assets
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy
