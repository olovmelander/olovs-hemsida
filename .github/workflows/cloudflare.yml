# Deploy Banvy (static assets + API Worker + D1 migrations) to Cloudflare Workers
# on every push to main (and manually via workflow_dispatch). Cloudflare is the
# main site (owner, 27 November), so a pull request runs the same tests, build and
# browser journeys without deploying: a journey that fails only after the merge
# leaves the main site on the previous release while GitHub Pages moves on.
name: cloudflare

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Deploys queue in order; a pull request's newer push replaces its own older run.
  group: ${{ github.event_name == 'pull_request' && format('cloudflare-pr-{0}', github.event.pull_request.number) || 'cloudflare-deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    name: ${{ github.event_name == 'pull_request' && 'release journeys' || 'deploy' }}
    # The browser pinned by playwright-core 1.65 supports Ubuntu 24.04.
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run application and Worker unit tests
        run: pnpm exec vitest run --maxWorkers 2 --testTimeout 30000

      - name: Build Banvy frontend for root path
        env:
          BANVY_BASE: /
        run: pnpm --filter @banvy/golf build

      - name: Verify prepared startup data matches the build
        run: node tools/check-prepared-startup.mjs --public apps/golf/dist

      - name: Install the Chromium matched to the browser harness
        run: |
          pnpm exec playwright-core install --with-deps chromium
          node --input-type=module -e "import { chromium } from 'playwright-core'; console.log('BANVY_CHROME_PATH=' + chromium.executablePath())" >> "$GITHUB_ENV"

      - name: Test real browser journeys against local D1 and the release assets
        run: bash tools/check-release-journeys.sh

      - name: Apply D1 migrations
        if: github.event_name != 'pull_request'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply banvy-db --remote

      - name: Deploy Worker and Static Assets
        if: github.event_name != 'pull_request'
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
      - name: Verify public Worker health and deployed asset identity
        if: github.event_name != 'pull_request'
        run: node tools/check-release-assets.mjs https://banvy.olovmelander.workers.dev/

      - name: Verify old bookmarks and policy pages on the public site
        if: github.event_name != 'pull_request'
        run: node tools/check-legacy-links.mjs --url https://banvy.olovmelander.workers.dev/
