name: course geo provider access

on:
  push:
    branches:
      - codex/terrain-v2-runtime-integration
    paths:
      - ".github/workflows/course-geo-access.yml"
      - "packages/course-v2/build-renderer-proof.mjs"
      - "packages/course-v2/capture-terrain-preview.mjs"
      - "packages/course-v2/capture-puttom-app-preview.mjs"
      - "packages/course-v2/terrain-preview*.mjs"
      - "packages/course-v2/*surface*.mjs"
      - "packages/course-v2/schemas/authoritative-surface-source-v1.schema.json"
      - "packages/course-geo/**"
      - "geo_data/course-v2/**"
      - "apps/golf/src/engine/v2-terrain-*.mjs"
      - "apps/golf/src/engine/v2-surface-*.mjs"
      - "apps/golf/src/engine/v2-puttom-preview.mjs"
      - "apps/golf/src/engine/material.js"
      - "apps/golf/src/main.js"
      - "apps/golf/index.html"
      - "apps/golf/vite.config.js"
      - "apps/golf/v2-terrain-proof.html"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: course-geo-provider-access-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lantmateriet-access:
    name: Lantmäteriet access preflight
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked renderer dependencies
        run: pnpm install --frozen-lockfile

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.78.0
          working-directory: packages/course-geo/toolchain
          frozen: true
          cache: true

      - name: Verify repository secrets are configured
        env:
          LANTMATERIET_USERNAME: ${{ secrets.LANTMATERIET_USERNAME }}
          LANTMATERIET_PASSWORD: ${{ secrets.LANTMATERIET_PASSWORD }}
        run: |
          if [ -z "$LANTMATERIET_USERNAME" ] || [ -z "$LANTMATERIET_PASSWORD" ]; then
            echo "Required Lantmäteriet repository secrets are missing" >&2
            exit 1
          fi

      - name: Verify authenticated STAC-hojd access
        id: terrain-source
        env:
          LANTMATERIET_USERNAME: ${{ secrets.LANTMATERIET_USERNAME }}
          LANTMATERIET_PASSWORD: ${{ secrets.LANTMATERIET_PASSWORD }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const endpoint = 'https://api.lantmateriet.se/stac-hojd/v1';
          const credentials = Buffer.from(
            `${process.env.LANTMATERIET_USERNAME}:${process.env.LANTMATERIET_PASSWORD}`,
            'utf8',
          ).toString('base64');
          const maximumBytes = 1024 * 1024;
          const authorization = `Basic ${credentials}`;

          async function readBounded(response, limit, label) {
            const declaredBytes = Number(response.headers.get('content-length'));
            if (Number.isFinite(declaredBytes) && declaredBytes > limit) {
              await response.body?.cancel(`${label} exceeds access-probe limit`);
              throw new Error(`${label} exceeds ${limit} byte probe limit`);
            }
            const reader = response.body?.getReader();
            if (!reader) throw new Error(`${label} has no readable response body`);
            const chunks = [];
            let total = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              total += value.byteLength;
              if (total > limit) {
                await reader.cancel(`${label} exceeds access-probe limit`);
                throw new Error(`${label} exceeds ${limit} byte probe limit`);
              }
              chunks.push(value);
            }
            const bytes = new Uint8Array(total);
            let offset = 0;
            for (const chunk of chunks) {
              bytes.set(chunk, offset);
              offset += chunk.byteLength;
            }
            return bytes;
          }

          async function fetchJson(url, label) {
            const response = await fetch(url, {
              headers: { Accept: 'application/geo+json, application/json', Authorization: authorization },
              redirect: 'error',
              signal: AbortSignal.timeout(20_000),
            });
            if (!response.ok) {
              throw new Error(`${label} denied the configured account (HTTP ${response.status})`);
            }
            const bytes = await readBounded(response, maximumBytes, label);
            return {
              bytesRead: bytes.byteLength,
              httpStatus: response.status,
              value: JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes)),
            };
          }

          const rootProbe = await fetchJson(endpoint, 'STAC-hojd root');
          const root = rootProbe.value;
          if (typeof root.stac_version !== 'string' || !Array.isArray(root.links)) {
            throw new Error('STAC-hojd returned an invalid STAC root');
          }

          const searchUrl = new URL(`${endpoint}/search`);
          searchUrl.searchParams.set('bbox', '18.9,63.28,18.98,63.32');
          searchUrl.searchParams.set('collections', 'dtm-cog');
          searchUrl.searchParams.set('limit', '1');
          const searchProbe = await fetchJson(searchUrl, 'STAC-hojd search');
          const feature = searchProbe.value?.features?.[0];
          const asset = feature?.assets?.data;
          if (!feature?.id || typeof asset?.href !== 'string') {
            throw new Error('STAC-hojd search returned no terrain data asset');
          }
          const assetUrl = new URL(asset.href);
          if (assetUrl.protocol !== 'https:' || assetUrl.hostname !== 'dl1.lantmateriet.se' ||
              !assetUrl.pathname.startsWith('/hojd/')) {
            throw new Error('STAC-hojd returned an unexpected terrain asset origin');
          }
          const rangeResponse = await fetch(assetUrl, {
            headers: {
              Accept: 'image/tiff, application/octet-stream',
              Authorization: authorization,
              Range: 'bytes=0-15',
            },
            redirect: 'error',
            signal: AbortSignal.timeout(20_000),
          });
          if (rangeResponse.status !== 206) {
            await rangeResponse.body?.cancel('byte-range response required');
            throw new Error(`Terrain asset did not provide a byte range (HTTP ${rangeResponse.status})`);
          }
          const contentRange = rangeResponse.headers.get('content-range') || '';
          const rangeMatch = contentRange.match(/^bytes 0-(\d+)\/(\d+)$/i);
          if (!rangeMatch || Number(rangeMatch[1]) > 63) {
            throw new Error('Terrain asset returned an invalid Content-Range');
          }
          const tiffHeader = await readBounded(rangeResponse, 64, 'terrain TIFF header');
          const isTiff = tiffHeader.length >= 4 &&
            ((tiffHeader[0] === 0x49 && tiffHeader[1] === 0x49 && [0x2a, 0x2b].includes(tiffHeader[2]) && tiffHeader[3] === 0x00) ||
             (tiffHeader[0] === 0x4d && tiffHeader[1] === 0x4d && tiffHeader[2] === 0x00 && [0x2a, 0x2b].includes(tiffHeader[3])));
          if (!isTiff) throw new Error('Terrain asset does not have a TIFF or BigTIFF header');

          if (assetUrl.search || assetUrl.hash || assetUrl.username || assetUrl.password ||
              /[\r\n]/.test(assetUrl.href)) {
            throw new Error('Terrain asset URL is not safe for a workflow output');
          }
          const { appendFileSync } = await import('node:fs');
          appendFileSync(process.env.GITHUB_OUTPUT, `asset_url=${assetUrl.href}\n`, 'utf8');

          console.log(JSON.stringify({
            ready: true,
            endpoint,
            httpStatus: rootProbe.httpStatus,
            stacVersion: root.stac_version,
            rootBytesRead: rootProbe.bytesRead,
            searchBytesRead: searchProbe.bytesRead,
            terrain: {
              collection: feature.collection,
              itemId: feature.id,
              httpStatus: rangeResponse.status,
              rangeSupported: true,
              bytesRead: tiffHeader.byteLength,
              sourceBytes: Number(rangeMatch[2]),
              tiffHeaderValid: true,
            },
            note: 'No credentials or authorization header were serialized.',
          }, null, 2));
          NODE

      - name: Verify authenticated Laserdata Skog COPC access
        id: laser-source
        env:
          LANTMATERIET_USERNAME: ${{ secrets.LANTMATERIET_USERNAME }}
          LANTMATERIET_PASSWORD: ${{ secrets.LANTMATERIET_PASSWORD }}
        run: |
          node --input-type=module <<'NODE'
          const endpoint = 'https://api.lantmateriet.se/stac-hojd/v1';
          const authorization = `Basic ${Buffer.from(
            `${process.env.LANTMATERIET_USERNAME}:${process.env.LANTMATERIET_PASSWORD}`,
            'utf8',
          ).toString('base64')}`;

          async function readBounded(response, maximumBytes, label) {
            const declared = Number(response.headers.get('content-length'));
            if (Number.isFinite(declared) && declared > maximumBytes) {
              await response.body?.cancel(`${label} exceeds probe limit`);
              throw new Error(`${label} exceeds ${maximumBytes} byte probe limit`);
            }
            const reader = response.body?.getReader();
            if (!reader) throw new Error(`${label} has no readable response body`);
            const chunks = [];
            let total = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              total += value.byteLength;
              if (total > maximumBytes) {
                await reader.cancel(`${label} exceeds probe limit`);
                throw new Error(`${label} exceeds ${maximumBytes} byte probe limit`);
              }
              chunks.push(value);
            }
            const result = new Uint8Array(total);
            let offset = 0;
            for (const chunk of chunks) {
              result.set(chunk, offset);
              offset += chunk.byteLength;
            }
            return result;
          }

          const searchUrl = new URL(`${endpoint}/search`);
          searchUrl.searchParams.set('bbox', '18.9,63.28,18.98,63.32');
          searchUrl.searchParams.set('collections', 'dsm-skoglig-copc');
          searchUrl.searchParams.set('limit', '10');
          const searchResponse = await fetch(searchUrl, {
            headers: {
              Accept: 'application/geo+json, application/json',
              Authorization: authorization,
            },
            redirect: 'error',
            signal: AbortSignal.timeout(20_000),
          });
          if (!searchResponse.ok) {
            throw new Error(`Laserdata Skog STAC search denied the configured account (HTTP ${searchResponse.status})`);
          }
          const searchBytes = await readBounded(searchResponse, 1024 * 1024, 'Laserdata Skog STAC search');
          const search = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(searchBytes));
          const courseBbox = [696916, 7024570, 697941, 7025595];
          // A playable hole-1 focus avoids the sparse seam between the two flight campaigns.
          const pilotCentre = [697337, 7025389];
          const span = 256;
          const [centreX, centreY] = pilotCentre;
          if (centreX < courseBbox[0] || centreX > courseBbox[2] ||
              centreY < courseBbox[1] || centreY > courseBbox[3]) {
            throw new Error('Laserdata Skog pilot focus is outside the playable course bbox');
          }
          const candidates = (search.features || []).map(feature => {
            const asset = feature?.assets?.data;
            const projectedBbox = feature?.properties?.['proj:bbox'] || asset?.['proj:bbox'];
            const advertisedDensity = Number(
              feature?.properties?.punkttathet ?? feature?.properties?.['pc:density'],
            );
            if (!feature?.id || feature.collection !== 'dsm-skoglig-copc' ||
                asset?.type !== 'application/vnd.laszip+copc' ||
                typeof asset.href !== 'string' || !Number.isSafeInteger(asset['file:size']) ||
                !Number.isFinite(advertisedDensity) || advertisedDensity <= 0 ||
                !Array.isArray(projectedBbox) || projectedBbox.length !== 4 ||
                projectedBbox.some(value => !Number.isFinite(value))) return null;
            const overlap = [
              Math.max(projectedBbox[0], courseBbox[0]),
              Math.max(projectedBbox[1], courseBbox[1]),
              Math.min(projectedBbox[2], courseBbox[2]),
              Math.min(projectedBbox[3], courseBbox[3]),
            ];
            if (overlap[2] - overlap[0] < span || overlap[3] - overlap[1] < span) return null;
            const minX = Math.round(Math.min(Math.max(centreX - span / 2, overlap[0]), overlap[2] - span));
            const minY = Math.round(Math.min(Math.max(centreY - span / 2, overlap[1]), overlap[3] - span));
            const bounds = [minX, minY, minX + span, minY + span];
            return {
              feature,
              asset,
              advertisedDensity,
              bounds,
              centreDistanceSquared: ((bounds[0] + bounds[2]) / 2 - centreX) ** 2 +
                ((bounds[1] + bounds[3]) / 2 - centreY) ** 2,
              capturedAt: String(
                feature.properties?.data_modified || feature.properties?.datetime || '',
              ),
            };
          }).filter(Boolean).sort((left, right) =>
            left.centreDistanceSquared - right.centreDistanceSquared ||
            right.capturedAt.localeCompare(left.capturedAt) ||
            String(left.feature.id).localeCompare(String(right.feature.id)));
          const selected = candidates[0];
          if (!selected) {
            throw new Error('Laserdata Skog STAC search returned no COPC asset');
          }
          const { feature, asset, advertisedDensity, bounds } = selected;
          const assetUrl = new URL(asset.href);
          if (assetUrl.protocol !== 'https:' || assetUrl.hostname !== 'dl1.lantmateriet.se' ||
              !assetUrl.pathname.startsWith('/hojd/data/pointcloud/sls/') ||
              !assetUrl.pathname.endsWith('.copc.laz') || assetUrl.search || assetUrl.hash ||
              assetUrl.username || assetUrl.password || /[\r\n]/.test(assetUrl.href)) {
            throw new Error('Laserdata Skog returned an unexpected COPC asset URL');
          }
          const rangeResponse = await fetch(assetUrl, {
            headers: {
              Accept: 'application/vnd.laszip+copc, application/octet-stream',
              Authorization: authorization,
              Range: 'bytes=0-588',
            },
            redirect: 'error',
            signal: AbortSignal.timeout(20_000),
          });
          if (rangeResponse.status !== 206) {
            await rangeResponse.body?.cancel('byte-range response required');
            throw new Error(`Laserdata Skog COPC did not provide a byte range (HTTP ${rangeResponse.status})`);
          }
          const contentRange = rangeResponse.headers.get('content-range') || '';
          const rangeMatch = contentRange.match(/^bytes 0-(\d+)\/(\d+)$/i);
          if (!rangeMatch || Number(rangeMatch[1]) !== 588 ||
              Number(rangeMatch[2]) !== asset['file:size']) {
            throw new Error('Laserdata Skog COPC returned an invalid Content-Range');
          }
          const header = await readBounded(rangeResponse, 589, 'Laserdata Skog COPC header');
          const ascii = new TextDecoder('ascii');
          const pointDataRecordFormat = header[104] & 0x3f;
          const infoRecordLength = header[395] | (header[396] << 8);
          const validCopc = header.byteLength === 589 &&
            ascii.decode(header.subarray(0, 4)) === 'LASF' &&
            header[24] === 1 && header[25] === 4 &&
            [6, 7, 8].includes(pointDataRecordFormat) &&
            ascii.decode(header.subarray(377, 381)) === 'copc' &&
            header[393] === 1 && header[394] === 0 && infoRecordLength === 160;
          if (!validCopc) throw new Error('Laserdata Skog asset does not have a valid COPC 1.0 header');

          const { appendFileSync } = await import('node:fs');
          appendFileSync(process.env.GITHUB_OUTPUT, `asset_url=${assetUrl.href}\n`, 'utf8');
          appendFileSync(process.env.GITHUB_OUTPUT, `bounds=${bounds.join(',')}\n`, 'utf8');
          appendFileSync(process.env.GITHUB_OUTPUT, `point_density=${advertisedDensity}\n`, 'utf8');

          console.log(JSON.stringify({
            ready: true,
            collection: feature.collection,
            itemId: feature.id,
            httpStatus: rangeResponse.status,
            rangeSupported: true,
            bytesRead: header.byteLength,
            sourceBytes: Number(rangeMatch[2]),
            pointDataRecordFormat,
            advertisedPointCount: feature.properties?.['pc:count'] ?? null,
            pointDensityPerSquareMetre: advertisedDensity,
            boundedPilot: {
              spanMetres: span,
              focusEpsg3006: pilotCentre,
              boundsEpsg3006: bounds,
              centreDistanceMetres: Math.sqrt(selected.centreDistanceSquared),
              selection: 'nearest-playable-hole-focus-then-newest',
            },
            note: 'No credentials, authorization headers or point-cloud bytes were serialized.',
          }, null, 2));
          NODE

      - name: Stream bounded Laserdata Skog classification statistics
        env:
          LANTMATERIET_USERNAME: ${{ secrets.LANTMATERIET_USERNAME }}
          LANTMATERIET_PASSWORD: ${{ secrets.LANTMATERIET_PASSWORD }}
          LASER_ASSET_URL: ${{ steps.laser-source.outputs.asset_url }}
          LASER_BOUNDS: ${{ steps.laser-source.outputs.bounds }}
          LASER_ADVERTISED_DENSITY: ${{ steps.laser-source.outputs.point_density }}
        run: |
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { mkdtempSync, readFileSync, rmSync } from 'node:fs';
          import os from 'node:os';
          import path from 'node:path';
          import { performance } from 'node:perf_hooks';
          import {
            laserDensityAssessment,
            laserStatisticsFromMetadata,
          } from './packages/course-geo/acquisition/laser-window.mjs';

          const encodedCredentials = Buffer.from(
            `${process.env.LANTMATERIET_USERNAME}:${process.env.LANTMATERIET_PASSWORD}`,
            'utf8',
          ).toString('base64');
          const authorization = `Basic ${encodedCredentials}`;
          process.stdout.write(`::add-mask::${encodedCredentials}\n::add-mask::${authorization}\n`);

          const assetUrl = new URL(process.env.LASER_ASSET_URL);
          if (assetUrl.protocol !== 'https:' || assetUrl.hostname !== 'dl1.lantmateriet.se' ||
              !assetUrl.pathname.startsWith('/hojd/data/pointcloud/sls/') ||
              !assetUrl.pathname.endsWith('.copc.laz') || assetUrl.search || assetUrl.hash) {
            throw new Error('refusing unexpected bounded COPC source');
          }
          const bounds = String(process.env.LASER_BOUNDS || '').split(',').map(Number);
          if (bounds.length !== 4 || bounds.some(value => !Number.isSafeInteger(value)) ||
              bounds[2] - bounds[0] !== 256 || bounds[3] - bounds[1] !== 256) {
            throw new Error('bounded COPC probe must be an exact 256 m EPSG:3006 square');
          }
          const maximumPoints = 1_000_000;
          const pipeline = [
            {
              type: 'readers.copc',
              filename: {
                path: assetUrl.href,
                headers: { Authorization: authorization },
              },
              bounds: `([${bounds[0]},${bounds[2]}],[${bounds[1]},${bounds[3]}])`,
              requests: 4,
            },
            { type: 'filters.head', count: maximumPoints },
            {
              type: 'filters.stats',
              dimensions: 'X,Y,Z,Classification,ReturnNumber,NumberOfReturns',
              count: 'Classification,ReturnNumber,NumberOfReturns',
            },
            { type: 'writers.null' },
          ];
          const temporaryDirectory = mkdtempSync(path.join(os.tmpdir(), 'banvy-copc-ci-'));
          const metadataFile = path.join(temporaryDirectory, 'metadata.json');
          const started = performance.now();
          try {
            const result = spawnSync('pixi', [
              'run', '--manifest-path', 'packages/course-geo/toolchain/pixi.toml', '--frozen',
              'pdal', 'pipeline', '--stdin', '--stream', '--metadata', metadataFile,
            ], {
              encoding: 'utf8',
              input: JSON.stringify(pipeline),
              maxBuffer: 128 * 1024 * 1024,
              env: { ...process.env, PROJ_NETWORK: 'OFF' },
            });
            if (result.error || result.status !== 0) {
              const unsafe = [result.error?.message, result.stdout, result.stderr].filter(Boolean).join('\n');
              const safe = unsafe
                .replaceAll(authorization, '<redacted>')
                .replaceAll(encodedCredentials, '<redacted>')
                .replaceAll(process.env.LANTMATERIET_USERNAME, '<redacted>')
                .replaceAll(process.env.LANTMATERIET_PASSWORD, '<redacted>');
              throw new Error(`bounded PDAL stream failed (${result.status ?? 'start'}): ${safe.slice(0, 2000)}`);
            }
            const statistics = laserStatisticsFromMetadata(
              JSON.parse(readFileSync(metadataFile, 'utf8')),
              maximumPoints,
              { expectedBoundsEpsg3006: bounds },
            );
            console.log(JSON.stringify({
              boundedAggregateBeforeDensityGate: statistics,
            }, null, 2));
            const density = laserDensityAssessment({
              areaSquareMetres: 256 * 256,
              source: {
                pointDensityPerSquareMetre: Number(process.env.LASER_ADVERTISED_DENSITY),
              },
            }, statistics.pointCount);
            if (!density.usable) {
              console.log('::warning::Laserdata Skog has insufficient local point coverage; no laser-derived runtime asset will be compiled for this window.');
            }
            console.log(JSON.stringify({
              ready: true,
              source: 'Laserdata Nedladdning, skog',
              format: 'COPC LAZ 1.4',
              boundsEpsg3006: bounds,
              spanMetres: 256,
              ...statistics,
              ...density,
              disposition: density.usable ? 'eligible-for-derived-assets' : 'coverage-gap-fallback-required',
              elapsedMilliseconds: Math.round(performance.now() - started),
              retainedPointCloudBytes: 0,
              note: 'The authenticated COPC was range-streamed and only aggregate statistics were retained.',
            }, null, 2));
          } finally {
            rmSync(temporaryDirectory, { recursive: true, force: true });
          }
          NODE

      - name: Build isolated Three r185 terrain proof
        run: node packages/course-v2/build-renderer-proof.mjs "$RUNNER_TEMP/puttom-terrain-preview"

      - name: Compile bounded 1 m terrain COG and BVCH pyramid
        env:
          CPL_VSIL_CURL_ALLOWED_EXTENSIONS: .tif
          CPL_VSIL_CURL_CACHE_SIZE: "67108864"
          GDAL_DISABLE_READDIR_ON_OPEN: EMPTY_DIR
          GDAL_HTTP_USERPWD: ${{ secrets.LANTMATERIET_USERNAME }}:${{ secrets.LANTMATERIET_PASSWORD }}
          PROJ_NETWORK: "OFF"
          TERRAIN_ASSET_URL: ${{ steps.terrain-source.outputs.asset_url }}
          TERRAIN_PREVIEW_ROOT: ${{ runner.temp }}/puttom-terrain-preview
          VSI_CACHE: "TRUE"
          VSI_CACHE_SIZE: "67108864"
        run: |
          terrain_output="$RUNNER_TEMP/puttom-terrain-1025px.tif"
          terrain_info="$RUNNER_TEMP/puttom-terrain-1025px.json"
          terrain_xyz="$RUNNER_TEMP/puttom-terrain-1025px.xyz"
          terrain_started="$(date +%s)"
          pixi run --manifest-path packages/course-geo/toolchain/pixi.toml --frozen \
            gdal_translate \
            -of COG \
            -co BLOCKSIZE=512 \
            -co COMPRESS=ZSTD \
            -co LEVEL=9 \
            -co NUM_THREADS=ALL_CPUS \
            -projwin_srs EPSG:3006 \
            -projwin 696916 7025595 697941 7024570 \
            "/vsicurl/$TERRAIN_ASSET_URL" \
            "$terrain_output"
          pixi run --manifest-path packages/course-geo/toolchain/pixi.toml --frozen \
            gdalinfo -json -stats "$terrain_output" > "$terrain_info"
          pixi run --manifest-path packages/course-geo/toolchain/pixi.toml --frozen \
            gdal_translate -of XYZ "$terrain_output" "$terrain_xyz"
          TERRAIN_ELAPSED_SECONDS="$(( $(date +%s) - terrain_started ))" \
          TERRAIN_INFO="$terrain_info" \
          TERRAIN_OUTPUT="$terrain_output" \
          TERRAIN_XYZ="$terrain_xyz" \
            node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          import { createReadStream, readFileSync, statSync } from 'node:fs';
          import { createInterface } from 'node:readline';
          import { compileTerrainAssets } from './packages/course-v2/terrain-compiler-node.mjs';
          import { writeTerrainPreviewBundle } from './packages/course-v2/terrain-preview-node.mjs';

          const output = process.env.TERRAIN_OUTPUT;
          const info = JSON.parse(readFileSync(process.env.TERRAIN_INFO, 'utf8'));
          const bytes = readFileSync(output);
          const band = info.bands?.[0];
          if (info.size?.[0] !== 1025 || info.size?.[1] !== 1025 || !band) {
            throw new Error(`Unexpected terrain window ${info.size?.join('x') || '<missing>'}`);
          }
          const imageStructure = info.metadata?.IMAGE_STRUCTURE || {};
          if (imageStructure.LAYOUT !== 'COG') {
            throw new Error('Compiled terrain output is not identified as a COG');
          }
          const wkt = info.coordinateSystem?.wkt || '';
          if (!wkt.startsWith('COMPOUNDCRS') || !wkt.includes('SWEREF99') || !wkt.includes('RH2000')) {
            throw new Error('Compiled terrain output lost SWEREF 99 or RH 2000');
          }
          const transform = info.geoTransform || [];
          const expectedTransform = [696916, 1, 0, 7025595, 0, -1];
          if (transform.length !== 6 || transform.some((value, index) =>
            Math.abs(value - expectedTransform[index]) > 1e-9)) {
            throw new Error(`Unexpected terrain geotransform ${JSON.stringify(transform)}`);
          }
          const rasterWidth = 1025;
          const rasterHeight = 1025;
          const heights = new Float32Array(rasterWidth * rasterHeight);
          let sampleIndex = 0;
          const lines = createInterface({
            input: createReadStream(process.env.TERRAIN_XYZ, { encoding: 'utf8' }),
            crlfDelay: Infinity,
          });
          for await (const line of lines) {
            if (!line) continue;
            if (sampleIndex >= heights.length) throw new Error('XYZ terrain contains too many samples');
            const parts = line.trim().split(/\s+/);
            if (parts.length !== 3) throw new Error(`Invalid XYZ terrain line ${sampleIndex + 1}`);
            const [easting, northing, sourceHeight] = parts.map(Number);
            const column = sampleIndex % rasterWidth;
            const row = Math.floor(sampleIndex / rasterWidth);
            const expectedEasting = transform[0] + transform[1] * (column + 0.5);
            const expectedNorthing = transform[3] + transform[5] * (row + 0.5);
            if (Math.abs(easting - expectedEasting) > 1e-6 ||
                Math.abs(northing - expectedNorthing) > 1e-6) {
              throw new Error(`XYZ terrain sample ${sampleIndex} is out of row-major grid order`);
            }
            if (!Number.isFinite(sourceHeight)) throw new Error(`XYZ terrain sample ${sampleIndex} is not finite`);
            heights[sampleIndex++] = sourceHeight === band.noDataValue ? Number.NaN : sourceHeight;
          }
          if (sampleIndex !== heights.length) {
            throw new Error(`XYZ terrain contains ${sampleIndex} samples; expected ${heights.length}`);
          }
          const compiled = compileTerrainAssets({
            groundId: 'puttom',
            courseSlugs: ['puttom'],
            heights,
            width: rasterWidth,
            height: rasterHeight,
            originEasting: transform[0] + transform[1] / 2,
            originNorthing: transform[3] + transform[5] / 2,
            sampleSpacingMetres: 1,
            tileSegments: 256,
            heightScaleMetres: 0.01,
          });
          if (compiled.stats.rootTiles !== 1 || compiled.stats.levels.length !== 3 ||
              compiled.stats.tileChunks !== 21 || compiled.resources.size !== 22) {
            throw new Error(`Unexpected BVCH pyramid ${JSON.stringify(compiled.stats)}`);
          }
          await writeTerrainPreviewBundle(process.env.TERRAIN_PREVIEW_ROOT, compiled, {
            label: 'Puttom · Lantmäteriet 1 m terräng',
          });
          console.log(JSON.stringify({
            ready: true,
            groundId: 'puttom',
            sampleSpanMetres: [1024, 1024],
            rasterPixels: info.size,
            resolutionMetres: [Math.abs(info.geoTransform?.[1]), Math.abs(info.geoTransform?.[5])],
            compoundCrs: 'EPSG:5845',
            cog: true,
            compression: imageStructure.COMPRESSION,
            outputBytes: statSync(output).size,
            sha256: createHash('sha256').update(bytes).digest('hex'),
            elevationMetres: {
              minimum: band.minimum,
              maximum: band.maximum,
              mean: band.mean,
              standardDeviation: band.stdDev,
              noDataValue: band.noDataValue,
            },
            bvch: {
              tileSegments: 256,
              lodLevels: compiled.stats.levels.length,
              tileChunks: compiled.stats.tileChunks,
              rootTiles: compiled.stats.rootTiles,
              uniqueChunks: compiled.stats.uniqueChunks,
              encodedBytes: compiled.stats.encodedBytes,
              decodedBytes: compiled.stats.decodedBytes,
              shellEncodedBytes: compiled.stats.shellEncodedBytes,
              sharedHeightOffsetMetres: compiled.pyramid.commonHeightOffsetMetres,
              heightScaleMetres: compiled.pyramid.heightScaleMetres,
              seamsVerified: compiled.pyramid.seamsVerified,
              morphMethod: compiled.pyramid.morphMethod,
            },
            elapsedSeconds: Number(process.env.TERRAIN_ELAPSED_SECONDS),
            retained: false,
            note: 'The source and compiled sample remain ephemeral on the GitHub runner.',
          }, null, 2));
          NODE

      - name: Capture retained pilot in forced WebGL2 and WebGPU-preferred modes
        run: >-
          node packages/course-v2/capture-terrain-preview.mjs
          --root "$RUNNER_TEMP/puttom-terrain-preview"
          --out "$RUNNER_TEMP/puttom-terrain-captures"
          --timeout 240

      - name: Stage verified runtime preview assets only
        run: >-
          node packages/course-v2/terrain-preview-release-node.mjs
          "$RUNNER_TEMP/puttom-terrain-preview"
          "$RUNNER_TEMP/puttom-terrain-runtime"

      - name: Upload derived Puttom runtime preview
        uses: actions/upload-artifact@v4
        with:
          name: puttom-terrain-runtime-${{ github.run_number }}
          path: ${{ runner.temp }}/puttom-terrain-runtime
          if-no-files-found: error
          retention-days: 7

      - name: Build real app with staged preview assets
        run: |
          mkdir -p apps/golf/public/v2/puttom
          cp -R "$RUNNER_TEMP/puttom-terrain-runtime/." apps/golf/public/v2/puttom/
          pnpm --filter @banvy/golf build
          node packages/course-v2/check-app-build.mjs

      - name: Capture interactive Puttom preview in the real app
        run: >-
          node packages/course-v2/capture-puttom-app-preview.mjs
          --root apps/golf/dist
          --out "$RUNNER_TEMP/puttom-app-captures"
          --timeout 300

      - name: Upload interactive app preview evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puttom-interactive-app-preview-${{ github.run_number }}
          path: ${{ runner.temp }}/puttom-app-captures
          if-no-files-found: warn
          retention-days: 7

      - name: Upload screenshots and backend report only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puttom-terrain-visual-proof-${{ github.run_number }}
          path: ${{ runner.temp }}/puttom-terrain-captures
          if-no-files-found: warn
          retention-days: 7
