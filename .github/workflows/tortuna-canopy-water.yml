name: Tortuna canopy and water
on:
  workflow_dispatch:
  push:
    branches: [codex/tortuna-golf-course-v2]
    paths: [geo_data/course-v2/tortuna/acquisition/RUN-canopy-water]
permissions:
  contents: read
concurrency:
  group: tortuna-canopy-water-${{ github.ref }}
  cancel-in-progress: false
jobs:
  canopy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --prefix packages/course-geo/copc-reader
      - name: Acquire pinned laser canopy windows
        env:
          LANTMATERIET_USERNAME: ${{ secrets.LANTMATERIET_USERNAME }}
          LANTMATERIET_PASSWORD: ${{ secrets.LANTMATERIET_PASSWORD }}
        run: node tortunabuild/acquire-canopy.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: tortuna-canopy
          path: |
            tortunabuild/cache/canopy/
            geo_data/course-v2/tortuna/vegetation/canopy-evidence.json
          if-no-files-found: error
          retention-days: 7
  water:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install shapely==2.1.2
      - name: Acquire and verify source water geometry
        env:
          LANTMATERIET_USERNAME: ${{ secrets.LANTMATERIET_USERNAME }}
          LANTMATERIET_PASSWORD: ${{ secrets.LANTMATERIET_PASSWORD }}
        run: python tortunabuild/acquire-water.py
      - uses: actions/upload-artifact@v4
        with:
          name: tortuna-water
          path: geo_data/course-v2/tortuna/acquisition/water-*
          if-no-files-found: error
          retention-days: 7
