# GitHub Pages' last publication. Banvy lives on Cloudflare since 27 November 2026
# (owner): this site no longer serves the app. Every old address under
# /olovs-hemsida/ answers with one page that sends the visitor to the same place on
# the main site with their own data, and sw.js clears an installed copy of the old
# app (tools/pages-moved-site.mjs; docs/pages-retired.md). It needs no build and
# no dependencies, and runs only when that page changes.
name: pages

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/pages.yml
      - tools/pages-moved-site.mjs
      - apps/golf/src/shell/pages-move.mjs
      - apps/golf/src/shell/backup-keys.mjs
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
    outputs:
      artifact_name: ${{ env.PAGES_ARTIFACT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # base_path from configure-pages is "/olovs-hemsida" (no trailing slash).
      - name: Write the page that moves every old address to Cloudflare
        run: |
          set -euo pipefail
          rm -rf _site
          node tools/pages-moved-site.mjs _site --base "${{ steps.pages.outputs.base_path }}/"
          echo "--- published ---" && ls -a _site

      - uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT }}
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ needs.build.outputs.artifact_name }}
