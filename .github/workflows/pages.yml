# Publish the site to GitHub Pages.
#
# Vite publishes the supported app and seven tiny legacy-URL redirects.
# The root HTML sources remain validation fixtures and must not overwrite those
# generated redirects. BANVY_BASE preserves this site's repository subpath.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # base_path from configure-pages is "/olovs-hemsida" (no trailing slash);
      # Vite wants one, and BASE_URL is documented to always end in a slash.
      - name: Build the app for this site's base path
        env:
          BANVY_BASE: ${{ steps.pages.outputs.base_path }}/
        run: pnpm --filter @banvy/golf build

      - name: Verify prepared data matches the complete course build
        run: node tools/check-prepared-startup.mjs --public apps/golf/dist

      - name: Assemble the site
        run: |
          set -euo pipefail
          rm -rf _site && mkdir -p _site
          cp -r apps/golf/dist/. _site/
          # Pages is served by a Jekyll-free static host; the marker stops any
          # future underscore-prefixed file from being silently dropped
          touch _site/.nojekyll
          echo "--- published ---" && ls _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
