name: Tortuna national source intake
on:
  workflow_dispatch:
  push:
    branches: [codex/tortuna-golf-course-v2]
    paths:
      - geo_data/course-v2/tortuna/acquisition/RUN-source-intake
permissions:
  contents: read
concurrency:
  group: tortuna-source-intake-${{ github.ref }}
  cancel-in-progress: false
jobs:
  terrain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read native 1 m terrain samples
        env:
          LANTMATERIET_USERNAME: ${{ secrets.LANTMATERIET_USERNAME }}
          LANTMATERIET_PASSWORD: ${{ secrets.LANTMATERIET_PASSWORD }}
        run: node packages/course-geo/acquisition/build-terrain-window.mjs --ground tortuna --out tortunabuild/cache/terrain
      - uses: actions/upload-artifact@v4
        with:
          name: tortuna-terrain
          path: |
            tortunabuild/cache/terrain/
            geo_data/course-v2/tortuna/acquisition/terrain-window.json
          if-no-files-found: error
          retention-days: 7
  orthophoto:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install rasterio==1.4.3 numpy==2.3.5 cryptography==45.0.7
      - name: Read 2026 RGBI windows and encrypt private review
        env:
          LANTMATERIET_USERNAME: ${{ secrets.LANTMATERIET_USERNAME }}
          LANTMATERIET_PASSWORD: ${{ secrets.LANTMATERIET_PASSWORD }}
        run: python tortunabuild/acquire-orthophoto.py
      - uses: actions/upload-artifact@v4
        with:
          name: tortuna-orthophoto-private-review
          path: |
            tortunabuild/cache/tortuna-review.enc
            geo_data/course-v2/tortuna/acquisition/orthophoto-review.json
          if-no-files-found: error
          retention-days: 7
